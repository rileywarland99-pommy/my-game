<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chairman & City</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
  :root{
    --bg:#0A0D13;
    --panel:#121826;
    --panel2:#1A2233;
    --panel3:#232D42;
    --accent:#FF7A29;
    --accent-light:#FFA35C;
    --accent2:#3DA5D9;
    --accent-rgb:255,122,41;
    --accent-ink:#1A0F06;
    --text:#EDEFF4;
    --text-dim:#8C94A6;
    --good:#3DBE6C;
    --bad:#E5484D;
    --divider:rgba(237,239,244,0.09);
    --gold:#E8C158;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%;}
  body{background:
      radial-gradient(1100px 550px at 12% -8%, rgba(var(--accent-rgb),0.16), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(var(--accent-rgb),0.07), transparent 55%),
      var(--bg);
    background-attachment:fixed;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;border:none;background:var(--accent);
    color:var(--accent-ink);font-weight:700;padding:10px 16px;font-size:13px;border-radius:5px;
    box-shadow:0 2px 6px rgba(0,0,0,0.35);
    transition:transform .08s ease, background .15s ease, box-shadow .15s ease;}
  button:hover{background:var(--accent-light);box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.18);}
  button:active{transform:scale(0.97);}
  button:disabled{background:#2b3244;color:#5c6577;cursor:not-allowed;box-shadow:none;}
  button.ghost{background:transparent;border:1px solid var(--divider);color:var(--text);}
  button.ghost:hover{background:var(--panel3);box-shadow:none;}
  button.danger-btn{background:var(--bad);color:#fff;}
  button.small{padding:6px 10px;font-size:11.5px;}
  button.chip{background:var(--panel3);color:var(--text);font-weight:600;border-radius:20px;padding:6px 14px;box-shadow:none;}
  button.chip.on{background:var(--accent);color:var(--accent-ink);}
  input,select,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--divider);
    color:var(--text);padding:9px 10px;font-size:13px;border-radius:5px;transition:border-color .15s ease;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.15);}
  input[type=color]{padding:2px;height:38px;width:56px;cursor:pointer;}
  .swatch-preset{width:28px;height:28px;border-radius:7px;cursor:pointer;border:2px solid var(--divider);flex-shrink:0;transition:transform .1s ease,border-color .1s ease;}
  .swatch-preset:hover{transform:translateY(-2px);}
  .swatch-preset.sel{border-color:var(--text);box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.35);}
  label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-dim);display:block;margin-bottom:5px;font-weight:700;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:150px;}

  /* ---------- shell / onboarding ---------- */
  .onboard-wrap{max-width:980px;margin:0 auto;padding:36px 20px 70px;}
  .hero{margin-bottom:24px;}
  .hero .kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;}
  .hero h1{font-size:38px;background:linear-gradient(90deg,var(--text),var(--accent-light));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--text-dim);max-width:600px;margin-top:10px;font-size:14.5px;line-height:1.55;}
  .step-indicator{display:flex;gap:6px;margin-bottom:26px;}
  .step-indicator span{flex:1;height:4px;background:var(--panel3);border-radius:2px;transition:background .2s ease;}
  .step-indicator span.done{background:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--divider);border-left:4px solid var(--accent);
    padding:24px 26px;margin-bottom:18px;border-radius:10px;box-shadow:0 14px 34px -18px rgba(0,0,0,0.65);}
  .panel h3{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent-light);margin-bottom:18px;}
  .swatch-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .kit-preview{width:64px;height:78px;position:relative;flex-shrink:0;}
  .kit-preview .body{position:absolute;inset:0;clip-path:polygon(20% 0,80% 0,100% 25%,85% 30%,85% 100%,15% 100%,15% 30%,0 25%);}
  .kit-preview .pattern{position:absolute;inset:0;clip-path:polygon(20% 0,80% 0,100% 25%,85% 30%,85% 100%,15% 100%,15% 30%,0 25%);}
  .badge-preview{width:74px;height:74px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .choice-card{background:var(--panel2);border:1px solid var(--divider);padding:12px;cursor:pointer;border-radius:7px;text-align:center;transition:all .12s ease;}
  .choice-card:hover{border-color:var(--accent2);transform:translateY(-1px);}
  .choice-card.sel{border-color:var(--accent);background:var(--panel3);box-shadow:0 0 0 1px var(--accent);}
  .choice-card h4{font-size:12.5px;text-transform:none;color:var(--text);}
  .choice-card p{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.35;}
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;}
  .mode-card{background:var(--panel2);border:1px solid var(--divider);padding:15px;cursor:pointer;border-radius:8px;transition:all .12s ease;}
  .mode-card:hover{border-color:var(--accent2);transform:translateY(-1px);}
  .mode-card.sel{border-color:var(--accent);background:var(--panel3);box-shadow:0 0 0 1px var(--accent);}
  .mode-card h4{color:var(--accent-light);font-size:14px;text-transform:uppercase;letter-spacing:0.03em;}
  .mode-card p{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.4;}
  .custom-toggle{margin-top:14px;font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .slider-field{margin-bottom:12px;}
  .slider-field .val{color:var(--accent-light);font-weight:700;float:right;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .avatar-svg{border-radius:50%;background:var(--panel2);}

  /* ---------- map screens ---------- */
  .map-shell{max-width:1180px;margin:0 auto;padding:30px 20px 70px;}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-bottom:16px;}
  .breadcrumb b{color:var(--text);cursor:pointer;}
  .breadcrumb b:hover{color:var(--accent-light);}
  .breadcrumb .sep{color:var(--panel3);}
  .map-wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .map-col{position:relative;flex:1.5;min-width:340px;}
  .locator-inset{position:absolute;bottom:10px;right:10px;width:110px;height:80px;border-radius:6px;
    overflow:hidden;border:2px solid rgba(255,255,255,0.5);box-shadow:0 6px 18px rgba(0,0,0,0.5);z-index:400;pointer-events:none;}
  .loc-section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);
    margin:14px 0 6px;font-weight:700;}
  .loc-section-label:first-child{margin-top:0;}
  #leaflet-map{width:100%;height:460px;border-radius:10px;border:1px solid var(--divider);background:#0e2233;box-shadow:0 14px 34px -18px rgba(0,0,0,0.7);}
  .side-panel{flex:1;min-width:290px;max-height:460px;overflow:auto;display:flex;flex-direction:column;gap:8px;}
  .map-hint{font-size:11.5px;color:var(--text-dim);background:var(--panel2);border:1px dashed var(--divider);padding:10px 12px;border-radius:7px;margin-bottom:12px;line-height:1.5;}
  .map-hint b{color:var(--accent-light);}
  .loc-chip{background:var(--panel2);border:1px solid var(--divider);padding:11px 13px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-radius:7px;transition:all .12s ease;}
  .loc-chip:hover{border-color:var(--accent2);transform:translateX(2px);}
  .loc-chip.active{border-color:var(--accent);background:var(--panel3);}
  .loc-chip .name{font-weight:700;font-size:13.5px;}
  .loc-chip .sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .loc-chip .chip-actions{display:flex;align-items:center;gap:8px;}
  .loc-chip .compare-btn{font-size:9.5px;text-transform:uppercase;letter-spacing:0.04em;padding:5px 9px;border-radius:12px;background:var(--panel3);color:var(--text-dim);font-weight:700;box-shadow:none;}
  .loc-chip .compare-btn:hover{background:var(--panel3);box-shadow:0 0 0 2px rgba(var(--accent-rgb),0.2);}
  .loc-chip .compare-btn.on{background:var(--accent);color:var(--accent-ink);}
  .loc-chip .go-arrow{color:var(--text-dim);font-size:16px;}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--text);border-radius:6px;}
  .leaflet-popup-tip{background:var(--panel2);}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px;}
  .stat-line{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--divider);}
  .stat-line b{color:var(--accent-light);}
  .site-card{background:var(--panel2);border:1px solid var(--divider);padding:14px;border-radius:8px;margin-bottom:10px;cursor:pointer;transition:all .12s ease;}
  .site-card:hover{border-color:var(--accent2);transform:translateY(-1px);}
  .site-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .site-card.custom{border-left:3px solid var(--gold);}
  .site-card h4{font-size:13.5px;color:var(--accent-light);}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .tag{font-size:10px;background:var(--panel3);color:var(--text-dim);padding:3px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:0.04em;}

  /* ---------- dashboard shell ---------- */
  .masthead{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;
    background:linear-gradient(180deg,#151C2C,#101623);border-bottom:1px solid var(--divider);position:sticky;top:0;z-index:20;
    box-shadow:0 2px 14px rgba(0,0,0,0.35);}
  .masthead-left{display:flex;align-items:center;gap:14px;}
  .mh-crest{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
    border:2px solid var(--gold);flex-shrink:0;box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.14);}
  .mh-name{font-size:15px;font-weight:800;line-height:1.1;}
  .mh-sub{font-size:11px;color:var(--text-dim);}
  .masthead-stats{display:flex;gap:22px;}
  .mh-stat{text-align:right;}
  .mh-stat .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);}
  .mh-stat .v{font-size:14px;font-weight:800;color:var(--text);}
  .continue-btn{background:var(--accent);padding:11px 22px;font-size:13px;font-weight:800;border-radius:6px;display:flex;align-items:center;gap:8px;}
  .layout{display:flex;flex:1;min-height:0;}
  .rail{width:78px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--divider);
    display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;}
  .rail-item{width:60px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
    border-radius:8px;cursor:pointer;color:var(--text-dim);transition:all .12s ease;}
  .rail-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .rail-item span{font-size:9px;text-transform:uppercase;letter-spacing:0.03em;text-align:center;line-height:1.1;}
  .rail-item:hover{background:var(--panel2);color:var(--text);}
  .rail-item.active{background:var(--panel3);color:var(--accent-light);box-shadow:inset 3px 0 0 var(--accent);}
  .rail-item.active svg{stroke:var(--accent-light);}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:auto;}
  .content{padding:24px 28px;flex:1;max-width:1180px;width:100%;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--divider);border-left:4px solid var(--accent2);
    padding:19px 21px;margin-bottom:18px;border-radius:8px;box-shadow:0 10px 26px -16px rgba(0,0,0,0.6);}
  .card.accent-gold{border-left-color:var(--gold);}
  .card.accent-warn{border-left-color:var(--bad);}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent2);margin-bottom:15px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--divider);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;}
  td{padding:7px 8px;border-bottom:1px solid var(--divider);}
  tr.player-row td{color:var(--accent-light);font-weight:700;background:rgba(var(--accent-rgb),0.08);}
  .pill{display:inline-block;padding:2px 9px;font-size:10px;font-weight:700;letter-spacing:0.04em;border-radius:10px;}
  .pill.good{background:var(--good);color:#0b1f10;}
  .pill.bad{background:var(--bad);color:#fff;}
  .pill.neutral{background:var(--panel3);color:var(--text-dim);}
  .news-item{padding:9px 0;border-bottom:1px solid var(--divider);font-size:12.5px;line-height:1.45;}
  .news-item .wk{color:var(--accent);font-weight:700;margin-right:6px;}
  .news-item.event{color:var(--gold);}
  .stand-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px;}
  .stand-card{background:var(--panel2);border:1px solid var(--divider);padding:13px;border-radius:6px;}
  .stand-card h4{font-size:12px;color:var(--accent-light);text-transform:uppercase;}
  .stand-card .tier{font-size:11px;color:var(--text-dim);margin:5px 0 10px;}
  .tile-palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tile-btn{background:var(--panel2);border:1px solid var(--divider);padding:9px 11px;font-size:11px;color:var(--text);text-align:left;border-radius:5px;}
  .tile-btn.sel{border-color:var(--accent);background:var(--panel3);}
  .tile-swatch{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;border-radius:2px;}
  canvas{display:block;image-rendering:crisp-edges;border-radius:6px;overflow:hidden;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .muted{color:var(--text-dim);font-size:12px;}
  .finance-line{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--divider);}
  .finance-line.total{border-top:2px solid var(--accent);margin-top:4px;padding-top:8px;font-weight:700;}
  .rival-card{background:var(--panel2);border-left:4px solid var(--bad);padding:13px 15px;margin-bottom:10px;border-radius:5px;}
  .rival-meter{height:6px;background:var(--panel3);margin-top:7px;position:relative;border-radius:3px;overflow:hidden;}
  .rival-meter .fill{height:100%;background:var(--bad);}
  .top-actions{display:flex;gap:10px;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px;}

  /* chairman profile */
  .chair-avatar-wrap{display:flex;gap:18px;align-items:center;}
  .avatar-svg{border-radius:50%;box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.18);}
  .trait-bar{margin-bottom:10px;}
  .trait-bar .lbl2{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;}
  .trait-track{height:7px;background:var(--panel3);border-radius:4px;overflow:hidden;}
  .trait-track .fill{height:100%;background:var(--accent2);}

  /* event modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(5,7,12,0.78);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-box{background:var(--panel);border:1px solid var(--divider);border-top:5px solid var(--gold);border-radius:8px;max-width:520px;width:100%;padding:28px;}
  .modal-box .kicker{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:0.12em;font-weight:800;margin-bottom:8px;}
  .modal-box h2{font-size:20px;margin-bottom:12px;}
  .modal-box p{font-size:13.5px;line-height:1.55;color:var(--text-dim);margin-bottom:18px;}
  .modal-choices{display:flex;flex-direction:column;gap:10px;}
  .modal-choices button{width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--divider);padding:12px 14px;}
  .modal-choices button:hover{border-color:var(--accent);background:var(--panel3);}
  .modal-choices button b{color:var(--accent-light);display:block;font-size:13px;margin-bottom:2px;}
  .modal-choices button span{font-size:11.5px;color:var(--text-dim);}

  /* ---------------- Accessibility ---------------- */
  .skip-link{position:absolute;left:-9999px;top:0;background:var(--accent);color:var(--accent-ink);
    padding:10px 16px;z-index:1000;border-radius:0 0 6px 0;font-weight:700;font-size:13px;}
  .skip-link:focus{left:0;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  [tabindex]:focus-visible, .loc-chip:focus-visible, .choice-card:focus-visible,
  .mode-card:focus-visible, .site-card:focus-visible, .rail-item:focus-visible{
    outline:3px solid var(--accent-light); outline-offset:2px;
  }
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ---------------- Music toggle ---------------- */
  .music-toggle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--panel3);color:var(--text-dim);padding:0;box-shadow:none;flex-shrink:0;}
  .music-toggle.on{background:var(--accent);color:var(--accent-ink);}
  .music-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}

  /* ---------------- Social tab ---------------- */
  .social-compose{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;}
  .social-compose textarea{flex:1;min-height:64px;resize:vertical;}
  .social-suggest-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .social-suggest-row button{background:var(--panel3);color:var(--text);font-weight:600;font-size:11.5px;padding:6px 12px;box-shadow:none;}
  .social-suggest-row button:hover{background:var(--panel2);}
  .social-post{background:var(--panel2);border:1px solid var(--divider);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
  .social-post .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:6px;}
  .social-post .body{font-size:13.5px;line-height:1.5;}
  .social-post .engagement{display:flex;gap:16px;margin-top:10px;font-size:11.5px;color:var(--text-dim);}
  .social-stat-row{display:flex;gap:18px;margin-bottom:18px;flex-wrap:wrap;}
  .social-stat{background:var(--panel2);border:1px solid var(--divider);border-radius:8px;padding:12px 18px;text-align:center;min-width:110px;}
  .social-stat .v{font-size:20px;font-weight:800;color:var(--accent-light);}
  .social-stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-dim);margin-top:2px;}
  .social-reply{background:var(--panel3);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px;color:var(--text-dim);}
  .social-reply b{color:var(--text);}

  /* ---------------- Mobile responsive ---------------- */
  @media (max-width: 860px){
    .content{padding:16px 14px;}
    .onboard-wrap{padding:16px 12px;}
    .hero h1{font-size:26px;}
    .panel, .card{padding:16px 15px;}
    .row{flex-direction:column;}
    .row .field{width:100%;}
    .map-wrap{flex-direction:column;}
    .map-col{min-width:0;width:100%;}
    #leaflet-map{height:320px;}
    .side-panel{max-height:none;width:100%;min-width:0;}
    .locator-inset{width:80px;height:58px;}
    .masthead{flex-wrap:wrap;gap:10px;padding:10px 14px;}
    .masthead-stats{gap:12px;order:3;width:100%;justify-content:space-between;}
    .mh-stat .v{font-size:12.5px;}
    .continue-btn{padding:9px 14px;font-size:12px;}
    .layout{flex-direction:column;}
    .rail{width:100%;flex-direction:row;overflow-x:auto;padding:6px 8px;gap:2px;

function sitesForTown(town){
  return SITE_TEMPLATES.map(st=>{
    const costMult = 0.7 + seededRandom(town.id+st.key+'cost')*0.8;
    return {
      id: town.id+'-'+st.key,
      name: town.name+' '+st.suffix,
      kind: st.kind,
      lat: town.lat+st.dLat, lng: town.lng+st.dLng,
      cost: Math.round(st.baseCost*costMult*(1+town.pop/300000)),
      ceiling: st.ceiling,
      transport: st.transport,
      desc: st.desc
    };
  });
}

function currentBackgroundMod(){
  const bg = CHAIR_BACKGROUNDS.find(b=>b.id===state.chairman.background) || CHAIR_BACKGROUNDS[0];
  return bg.mod;
}

function startGame(){
  const c = state.club;
  const preset = c.custom ? state.customStats : GAME_MODES[c.mode];
  const town = TOWN_DATA.find(x=>x.id===state.selectedTownId);
  const site = state.finalSite || ((state.selectedSiteId==='custom' && state.customSite)
    ? state.customSite
    : sitesForTown(town).find(s=>s.id===state.selectedSiteId));
  const mod = currentBackgroundMod();

  const rivals = TOWN_DATA.filter(x=>x.id!==town.id).map(x=>{
    const dist = Math.round(haversine(town.lat,town.lng,x.lat,x.lng));
    return {
      id:x.id+'-fc',
      name: x.name.replace(' (Thurrock)','')+' '+CLUB_SUFFIXES[Math.floor(seededRandom(x.id+'suffix')*CLUB_SUFFIXES.length)],
      townId:x.id, distance: dist,
      tier: Math.max(0, Math.min(TIERS.length-1, preset.tier + Math.round((Math.random()*4)-2))),
      reputation: Math.max(5, Math.round(preset.reputation + (Math.random()*30-15))),
      playerQuality: Math.max(10, Math.round(preset.playerQuality + (Math.random()*20-10))),
      form:[], rivalryScore: Math.max(0, Math.round(70 - dist*0.6)),
      matchesPlayed:0
    };
  });

  const tier = preset.tier;
  let leagueClubs = rivals.filter(r=>r.tier===tier).sort((a,b)=>a.distance-b.distance);
  let genCount = 0;
  while(leagueClubs.length < 9){
    genCount++;
    leagueClubs.push({
      id:'gen-'+tier+'-'+genCount,
      name: GENERIC_NAMES[(genCount+tier*3)%GENERIC_NAMES.length],
      townId:null, distance: 9999, tier:tier,
      reputation: Math.max(5, Math.round(preset.reputation + (Math.random()*30-15))),
      playerQuality: Math.max(10, Math.round(preset.playerQuality + (Math.random()*20-10))),
      form:[], rivalryScore: 5, matchesPlayed:0
    });
  }
  leagueClubs = leagueClubs.slice(0,9);

  const cityGridSize = 7;
  const cityGrid = [];
  for(let y=0;y<cityGridSize;y++){ const row=[]; for(let x=0;x<cityGridSize;x++) row.push('empty'); cityGrid.push(row); }
  const mid = Math.floor(cityGridSize/2);
  cityGrid[mid][mid] = 'stadium';

  const startCash = Math.round(preset.cash*(mod.cashMult||1) - site.cost);

  state.game = {
    week:1, season:1, seasonWeeks: 20,
    club:{
      ...c,
      cash: startCash, debt: preset.debt,
      reputation: Math.max(1, preset.reputation + (mod.reputationBonus||0)),
      supporters: preset.supporters,
      playerQuality: preset.playerQuality, academyQuality: preset.academyQuality,
      staffQuality: Math.min(100, preset.staffQuality + (mod.staffBonus||0)),
      tier: preset.tier,
      stands:{ north: preset.standTier, south: Math.max(0,preset.standTier-1), east: Math.max(0,preset.standTier-2), west: Math.max(0,preset.standTier-2) },
      form:[], matchesPlayed:0, wins:0, draws:0, losses:0, points:0, gf:0, ga:0,
      ticketPrice: 12,
      difficulty: preset.difficulty,
      sponsorBonus: mod.sponsorBonus||0, cityDiscount: mod.cityDiscount||0
    },
    chairman: {...state.chairman},
    town: JSON.parse(JSON.stringify(town)),
    site: JSON.parse(JSON.stringify(site)),
    townStats:{ population: town.pop, happiness:60, traffic:20, pollution:10 },
    allRivals: rivals,
    league: leagueClubs,
    cityGrid, cityGridSize,
    financeLog:[],
    news:[{wk:0, text:`${c.name} is founded in ${town.name} in ${c.founded}, based at the new ${site.name}. The chairman's journey begins.`}],
    fixtures: buildFixtures(leagueClubs),
    selectedCityTile:'road',
    pendingEvent:null
  };
  state.screen='dashboard';
  state.dashTab='overview';
  save();
  render();
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function buildFixtures(leagueClubs){
  const opponents = leagueClubs.map(c=>c.id);
  const fixtures = {}; let w=1;
  opponents.forEach(id=>{ fixtures[w]={oppId:id, home:true}; w++; });
  opponents.forEach(id=>{ fixtures[w]={oppId:id, home:false}; w++; });
  return fixtures;
}

/* ---------------- Simulation ---------------- */

function clubStrength(club){
  return club.reputation*0.35 + club.playerQuality*0.35 + (club.staffQuality||25)*0.15 + (club.academyQuality||20)*0.15;
}
function simulateMatch(home, away, homeAdvantage){
  const sH = clubStrength(home) + (homeAdvantage||0);
  const sA = clubStrength(away);
  const total = sH+sA;
  const expH = 1.1 + (sH/total)*2.4;
  const expA = 1.1 + (sA/total)*2.4;
  return {gH:poissonish(expH), gA:poissonish(expA)};
}
function poissonish(lambda){ let L=Math.exp(-lambda),k=0,p=1; do{k++;p*=Math.random();}while(p>L&&k<10); return k-1; }
function findRival(oppId){ return state.game.allRivals.find(r=>r.id===oppId); }

function tickWeek(){
  if(state.game.pendingEvent) return;
  const g = state.game;
  const fixture = g.fixtures[g.week];
  const news = [];

  if(fixture){
    const oppData = g.league.find(c=>c.id===fixture.oppId) || findRival(fixture.oppId);
    const rival = findRival(fixture.oppId);
    const isDerby = rival && rival.rivalryScore >= 55;
    const {gH,gA} = simulateMatch(fixture.home?g.club:oppData, fixture.home?oppData:g.club, fixture.home?4:0);
    const playerGoals = fixture.home?gH:gA, oppGoals = fixture.home?gA:gH;
    updateClubResult(g.club, playerGoals, oppGoals);
    updateClubResult(oppData, oppGoals, playerGoals);
    oppData.matchesPlayed=(oppData.matchesPlayed||0)+1;
    if(rival){ rival.matchesPlayed++; rival.rivalryScore=Math.min(100, rival.rivalryScore+4+(isDerby?4:0)); }

    const result = playerGoals>oppGoals?'win':playerGoals<oppGoals?'loss':'draw';
    const attendance = computeAttendance(isDerby);
    const gate = attendance*g.club.ticketPrice;
    if(fixture.home){
      g.club.cash += gate;
      news.push(`${isDerby?'DERBY DAY! ':''}${g.club.name} ${playerGoals}-${oppGoals} ${oppData.name}. Attendance ${attendance.toLocaleString()}, gate receipts £${Math.round(gate).toLocaleString()}.`);
    } else {
      news.push(`${isDerby?'DERBY DAY! ':''}${oppData.name} ${oppGoals}-${playerGoals} ${g.club.name} (away).`);
    }
    if(result==='win') g.club.reputation=Math.min(100,g.club.reputation+(isDerby?2.5:1));
    if(result==='loss') g.club.reputation=Math.max(1,g.club.reputation-(isDerby?1.5:0.6));
    g.club.supporters=Math.max(10,Math.round(g.club.supporters*(result==='win'?1.01:result==='loss'?0.995:1.0)));
  } else {
    news.push('Quiet week — training continues, the club and town tick over.');
  }

  const fin = weeklyFinance();
  g.club.cash += fin.net;
  g.financeLog.push({week:g.week, ...fin});
  if(g.financeLog.length>16) g.financeLog.shift();

  tickTown();

  g.allRivals.forEach(r=>{
    if(Math.random()<0.15) r.reputation=Math.min(100,r.reputation+Math.round(Math.random()*3));
    if(Math.random()<0.1) r.playerQuality=Math.min(100,r.playerQuality+Math.round(Math.random()*3));
  });

  g.news.unshift(...news.map(n=>({wk:g.week, text:n})));
  g.news = g.news.slice(0,50);

  g.week++;
  let endedSeason=false;
  if(g.week > g.seasonWeeks){ endSeason(); endedSeason=true; }

  maybeTriggerEvent();

  save(); render();
}

function maybeTriggerEvent(){
  const g = state.game;
  if(g.pendingEvent) return;
  const riskFactor = 0.9 + (g.chairman.riskTolerance/100)*0.3;
  if(Math.random() > 0.24*riskFactor) return;
  const ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  if(ev.auto){
    const result = ev.apply(g);
    g.news.unshift({wk:g.week, text:`${ev.title}: ${ev.text(g)}`, event:true});
  } else {
    g.pendingEvent = ev.id;
  }
}

function resolveEvent(choiceIdx){
  const g = state.game;
  const ev = EVENTS.find(e=>e.id===g.pendingEvent);
  if(!ev) return;
  const choice = ev.choices[choiceIdx];
  const resultText = choice.apply(g);
  g.news.unshift({wk:g.week, text:`${ev.title}: ${resultText}`, event:true});
  g.pendingEvent = null;
  save(); render();
}

function updateClubResult(c, gf, ga){
  c.matchesPlayed=(c.matchesPlayed||0)+1; c.gf=(c.gf||0)+gf; c.ga=(c.ga||0)+ga;
  if(gf>ga){ c.wins=(c.wins||0)+1; c.points=(c.points||0)+3; c.form=[...(c.form||[]),'W'].slice(-5); }
  else if(gf<ga){ c.losses=(c.losses||0)+1; c.form=[...(c.form||[]),'L'].slice(-5); }
  else { c.draws=(c.draws||0)+1; c.points=(c.points||0)+1; c.form=[...(c.form||[]),'D'].slice(-5); }
}
function computeAttendance(isDerby){
  const g = state.game, capacity = totalCapacity();
  const demand = g.club.supporters*(0.55+(g.club.reputation/200))*(isDerby?1.5:1)*(16/(g.club.ticketPrice+4));
  return Math.max(50, Math.min(capacity, Math.round(demand)));
}
function totalCapacity(){
  const s = state.game.club.stands;
  return STAND_TIERS[s.north].cap+STAND_TIERS[s.south].cap+STAND_TIERS[s.east].cap+STAND_TIERS[s.west].cap;
}
function weeklyFinance(){
  const g = state.game;
  const sponsorship = Math.round((200+g.club.reputation*8)*(1+(g.club.sponsorBonus||0)));
  const merch = Math.round(g.club.supporters*0.4);
  const propertyIncome = cityIncome();
  const wages = Math.round((g.club.playerQuality*40)+(g.club.staffQuality*15));
  const maintenance = Math.round(totalCapacity()*0.35);
  const debtInterest = Math.round(g.club.debt*0.002);
  const income = sponsorship+merch+propertyIncome;
  const expenses = wages+maintenance+debtInterest;
  return {income:Math.round(income), expenses:Math.round(expenses), net:Math.round(income-expenses),
    sponsorship, merch, propertyIncome, wages, maintenance, debtInterest};
}
function cityIncome(){
  const g = state.game; let total=0;
  for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){
    const def = CITY_TILE_TYPES[g.cityGrid[y][x]]; if(def && def.income) total+=def.income;
  }
  return total;
}
function tickTown(){
  const g = state.game;
  let pop=0, traffic=0, reputationBoost=0;
  for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){
    const def = CITY_TILE_TYPES[g.cityGrid[y][x]];
    if(def){ pop+=(def.popEffect||0); traffic+=(def.trafficEffect||0); reputationBoost+=(def.reputation||0); }
  }
  g.townStats.population += pop*3+Math.round(g.club.reputation*0.3);
  g.townStats.traffic = Math.max(0,Math.min(100,g.townStats.traffic+traffic));
  g.townStats.happiness = Math.max(0,Math.min(100,g.townStats.happiness+(reputationBoost*0.5)-(g.townStats.traffic>70?1:0)));
  if(g.townStats.traffic>80 && Math.random()<0.2){
    g.news.unshift({wk:g.week, text:`Local residents raise concerns about matchday traffic congestion near ${g.town.name} — the council is watching closely.`});
    g.club.reputation = Math.max(1, g.club.reputation-0.5);
  }
}
function endSeason(){
  const g = state.game;
  const table = [{id:'player', name:g.club.name+' (You)', points:g.club.points, gf:g.club.gf, ga:g.club.ga},
    ...g.league.map(c=>({id:c.id,name:c.name,points:c.points||0,gf:c.gf||0,ga:c.ga||0}))]
    .sort((a,b)=> b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga));
  const playerPos = table.findIndex(r=>r.id==='player')+1;
  let msg = `Season ${g.season} ends. ${g.club.name} finish ${ordinal(playerPos)} in ${TIERS[g.club.tier]} with ${g.club.points} points.`;
  if(playerPos<=2 && g.club.tier<TIERS.length-1){ g.club.tier++; msg+=` Promoted to ${TIERS[g.club.tier]}!`; g.club.reputation=Math.min(100,g.club.reputation+8); }
  else if(playerPos>=8 && g.club.tier>0){ g.club.tier--; msg+=` Relegated to ${TIERS[g.club.tier]}.`; g.club.reputation=Math.max(1,g.club.reputation-6); }
  g.news.unshift({wk:g.week, text:msg});

  g.season++; g.week=1;
  g.club.matchesPlayed=0; g.club.wins=0; g.club.draws=0; g.club.losses=0; g.club.points=0; g.club.gf=0; g.club.ga=0; g.club.form=[];
  let leagueClubs = g.allRivals.filter(r=>r.tier===g.club.tier);
  let genCount=0;
  while(leagueClubs.length<9){
    genCount++;
    leagueClubs.push({id:'gen-'+g.club.tier+'-'+g.season+'-'+genCount,
      name: GENERIC_NAMES[(genCount+g.club.tier*3)%GENERIC_NAMES.length],
      townId:null, distance:9999, tier:g.club.tier,
      reputation: Math.max(5, Math.round(g.club.reputation+(Math.random()*30-15))),
      playerQuality: Math.max(10, Math.round(g.club.playerQuality+(Math.random()*20-10))),
      form:[], rivalryScore:5, matchesPlayed:0});
  }
  g.league = leagueClubs.slice(0,9).map(c=>({...c, points:0, gf:0, ga:0, wins:0, draws:0, losses:0, matchesPlayed:0}));
  g.fixtures = buildFixtures(g.league);
}
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

/* ---------------- Persistence ---------------- */

async function save(){
  try{
    const payload = JSON.stringify(state);
    if(window.storage && typeof window.storage.set === 'function'){
      await window.storage.set(STORAGE_KEY, payload, false);
    }else{
      localStorage.setItem(STORAGE_KEY, payload);
    }
  }catch(e){ console.warn('save failed', e); }
}
async function loadSave(){
  try{
    let value = null;
    if(window.storage && typeof window.storage.get === 'function'){
      const r = await window.storage.get(STORAGE_KEY, false);
      value = r && r.value ? r.value : null;
    }else{
      value = localStorage.getItem(STORAGE_KEY);
    }
    if(value){
      const parsed = JSON.parse(value);
      if(parsed && typeof parsed === 'object' && parsed.club && parsed.chairman){
        state = parsed;
        return true;
      }
    }
  }catch(e){
    console.warn('load save failed, starting a new game', e);
    try{ localStorage.removeItem(STORAGE_KEY); }catch(_){}
  }
  return false;
}
async function resetGame(){
  try{
    if(window.storage && typeof window.storage.delete === 'function'){
      await window.storage.delete(STORAGE_KEY, false);

/* ---------------- DOM helpers ---------------- */
function el(html){
  html = html.trim();
  const m = html.match(/^<(\w+)/);
  const tag = m ? m[1].toLowerCase() : null;
  let container;
  if(tag==='tr') container = document.createElement('tbody');
  else if(tag==='td' || tag==='th') container = document.createElement('tr');
  else if(tag==='option') container = document.createElement('select');
  else container = document.createElement('div');
  container.innerHTML = html;
  return container.firstElementChild;
}
function $(sel,root){ return (root||document).querySelector(sel); }
function $all(sel,root){ return Array.from((root||document).querySelectorAll(sel)); }
function svgIcon(path,viewBox){ return `<svg viewBox="${viewBox||'0 0 24 24'}"><path d="${path}"/></svg>`; }

/* ---------------- Background music (self-contained synth ambient loop) ---------------- */
let audioCtx = null, musicNodes = null;
function toggleMusic(){
  state.musicOn = !state.musicOn;
  if(state.musicOn) startMusic(); else stopMusic();
}
function startMusic(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    stopMusic();
    const master = audioCtx.createGain(); master.gain.value = 0.05; master.connect(audioCtx.destination);
    const chords = [[130.81,164.81,196.00],[146.83,174.61,220.00],[110.00,146.83,174.61],[130.81,164.81,196.00]];
    let chordIdx = 0;
    function playChord(){
      const now = audioCtx.currentTime;
      chords[chordIdx%chords.length].forEach((freq)=>{
        const osc = audioCtx.createOscillator(); osc.type='sine'; osc.frequency.value=freq;
        const g = audioCtx.createGain(); g.gain.setValueAtTime(0, now);
        g.gain.linearRampToValueAtTime(0.6, now+1.5);
        g.gain.linearRampToValueAtTime(0, now+7.5);
        osc.connect(g); g.connect(master);
        osc.start(now); osc.stop(now+8);
      });
      chordIdx++;
    }
    playChord();
    const interval = setInterval(playChord, 8000);
    musicNodes = {master, interval};
  }catch(e){ console.warn('Music unavailable:', e); state.musicOn=false; }
}
function stopMusic(){
  if(musicNodes){ clearInterval(musicNodes.interval); try{ musicNodes.master.disconnect(); }catch(e){} musicNodes=null; }
}
function musicToggleHtml(){
  return `<button type="button" id="music-toggle" class="music-toggle ${state.musicOn?'on':''}" aria-pressed="${state.musicOn}" aria-label="${state.musicOn?'Mute background music':'Play background music'}">
    ${state.musicOn
      ? '<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 11-6 0 3 3 0 016 0zm10-2a3 3 0 11-6 0 3 3 0 016 0z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12M9 18a3 3 0 11-6 0 3 3 0 016 0zm10-2a3 3 0 11-6 0 3 3 0 016 0zM3 3l18 18"/></svg>'}
  </button>`;
}
function bindMusicToggle(){
  $('#music-toggle')?.addEventListener('click', ()=>{ toggleMusic(); render(); });
}

/* ---------------- Club colour theming ---------------- */

function hexToRgb(hex){
  if(!hex) return [255,122,41];
  let m = hex.replace('#','');
  if(m.length===3) m = m.split('').map(ch=>ch+ch).join('');
  const n = parseInt(m,16);
  if(isNaN(n)) return [255,122,41];
  return [(n>>16)&255, (n>>8)&255, n&255];
}
function mixWithWhite(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const nr = Math.round(r+(255-r)*amt), ng = Math.round(g+(255-g)*amt), nb = Math.round(b+(255-b)*amt);
  return `rgb(${nr},${ng},${nb})`;
}
function relativeLuminance(hex){
  const [r,g,b] = hexToRgb(hex).map(v=>v/255);
  return 0.2126*r + 0.7152*g + 0.0722*b;
}
function applyClubTheme(){
  const c = state && state.club;
  if(!c || !c.primary) return;
  const root = document.documentElement.style;
  const [r,g,b] = hexToRgb(c.primary);
  root.setProperty('--accent', c.primary);
  root.setProperty('--accent-light', mixWithWhite(c.primary, 0.4));
  root.setProperty('--accent-rgb', `${r},${g},${b}`);
  root.setProperty('--accent-ink', relativeLuminance(c.primary) > 0.5 ? '#14181f' : '#fdfdfd');
  if(c.secondary) root.setProperty('--accent2', c.secondary);
}

/* ---------------- Render dispatcher ---------------- */

function render(){
  const app = document.getElementById('app');
  if(!app) return;
  try{
    if(leafletMapInstance){ try{ leafletMapInstance.remove(); }catch(e){} leafletMapInstance=null; }
    app.innerHTML='';
    if(!state) state=freshState();
    applyClubTheme();
    app.appendChild(el(`<a href="#main-content" class="skip-link">Skip to main content</a>`));
    if(state.screen==='onboard') app.appendChild(renderOnboard());
    else if(state.game) app.appendChild(renderDashboard());
    else { state.screen='onboard'; app.appendChild(renderOnboard()); }
  }catch(err){
    console.error('Chairman & City render error:', err);
    app.innerHTML = `<div class="onboard-wrap">
      <div class="panel" style="border-left-color:var(--bad);">
        <h3 style="color:var(--bad);">Game failed to render</h3>
        <p style="color:var(--text-dim);line-height:1.6;">
          Chairman &amp; City hit a startup error. Your game data has been kept where possible.
          Click below to restart the setup.
        </p>
        <button id="fatal-reset">Restart Game</button>
        <details style="margin-top:16px;">
          <summary class="muted">Technical details</summary>

  let pattern='';
  if(c.kitPattern==='hoops') pattern=`<div class="pattern" style="background:repeating-linear-gradient(0deg,${c.secondary} 0 10px,transparent 10px 20px)"></div>`;
  else if(c.kitPattern==='stripes') pattern=`<div class="pattern" style="background:repeating-linear-gradient(90deg,${c.secondary} 0 8px,transparent 8px 16px)"></div>`;
  else if(c.kitPattern==='sash') pattern=`<div class="pattern" style="background:linear-gradient(135deg,transparent 40%,${c.secondary} 40% 55%,transparent 55%)"></div>`;
  else if(c.kitPattern==='halves') pattern=`<div class="pattern" style="background:linear-gradient(90deg,${c.secondary} 50%,transparent 50%)"></div>`;
  else if(c.kitPattern==='checkered') pattern=`<div class="pattern" style="background-image:linear-gradient(45deg,${c.secondary} 25%,transparent 25%,transparent 75%,${c.secondary} 75%),linear-gradient(45deg,${c.secondary} 25%,transparent 25%,transparent 75%,${c.secondary} 75%);background-size:14px 14px;background-position:0 0,7px 7px;"></div>`;
  return `<div class="body" style="background:${c.primary}"></div>${pattern}`;
}

/* Shared satellite map initialiser. Always returns synchronously (never throws) so
   that button bindings elsewhere are never skipped just because the map failed to load —
   this was the cause of players getting stuck unable to advance past a location screen. */
function initSatelliteMap(elId, center, zoom, onClick){
  const mapEl = document.getElementById(elId);
  if(!mapEl) return null;
  if(typeof L==='undefined'){
    mapEl.innerHTML = '<div style="padding:20px;color:#8C94A6;">Satellite imagery unavailable right now — you can still use the list below.</div>';
    return null;
  }
  try{
    const map = L.map(elId,{scrollWheelZoom:true}).setView(center, zoom);
    leafletMapInstance = map;
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {attribution:'Tiles &copy; Esri', maxZoom:19}).addTo(map);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:19, opacity:0.9}).addTo(map);
    if(onClick) map.on('click', onClick);
    return map;
  }catch(e){
    console.error('Map init failed:', e);
    mapEl.innerHTML = '<div style="padding:20px;color:#8C94A6;">Satellite imagery unavailable right now — you can still use the list below.</div>';
    return null;
  }
}

/* Small inset locator map showing the whole UK with a marker for the current focus point —
   gives constant geographic context ("the map behind the map") while drilling into detail. */
function renderLocatorInset(focusLatLng){
  const holder = el(`<div class="locator-inset" id="locator-inset" aria-hidden="true"></div>`);
  setTimeout(()=>{
    if(typeof L==='undefined') return;
    try{
      const mini = L.map('locator-inset',{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,touchZoom:false,keyboard:false})
        .setView(COUNTRY_VIEW.center, COUNTRY_VIEW.zoom-1);
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(mini);
      if(focusLatLng){
        L.circleMarker(focusLatLng,{radius:6,color:'var(--accent)',fillColor:'var(--accent)',fillOpacity:1,weight:2}).addTo(mini);
      }
    }catch(e){ /* inset is decorative — fail silently */ }
  },0);
  return holder;
}

const PARK_NAME_PREFIXES = ['Meadow','Common','Green','Fields','Recreation Ground','Playing Fields','Park','Gardens','Sports Ground','Memorial Field'];
function generateParksForSite(site, town){
  const seed = site.id+town.id;
  const count = 3;
  const parks = [];
  for(let i=0;i<count;i++){
    const angle = (i/count)*2*Math.PI + seededRandom(seed+'ang'+i)*1.4;
    const dist = 0.0018 + seededRandom(seed+'dist'+i)*0.0032;
    const lat = site.lat + Math.cos(angle)*dist;
    const lng = site.lng + Math.sin(angle)*dist;
    const sizeRoll = seededRandom(seed+'size'+i);
    const size = sizeRoll<0.34?'Compact':sizeRoll<0.7?'Standard':'Spacious';
    const ceilingMod = size==='Compact'?-1:size==='Spacious'?1:0;
    const costMod = size==='Compact'?-0.1:size==='Spacious'?0.18:0;
    const nameRoll = Math.floor(seededRandom(seed+'name'+i)*PARK_NAME_PREFIXES.length);
    parks.push({
      id: site.id+'-park-'+i, name:`${town.name} ${PARK_NAME_PREFIXES[nameRoll]}`,
      lat, lng, size, ceilingMod, costMod,
      desc: size==='Compact' ? 'A tight plot right where you want it — cheaper, but the stadium footprint will always feel snug.'
        : size==='Spacious' ? 'Plenty of room around this spot — pricier, but expansion later will be easy.'
        : 'A balanced plot with sensible room to grow.'
    });
  }
  return parks;
}

function computeCustomSite(town, lat, lng){
  const distKm = haversine(town.lat, town.lng, lat, lng);
  const jitter = 0.85 + seededRandom((lat+lng).toFixed(4)+'customcost') * 0.4;
  const cost = Math.max(4000, Math.round((11000 + distKm*6500) * jitter * (1+town.pop/400000)));
  const ceiling = distKm<1 ? 3 : distKm<3 ? 4 : distKm<6 ? 5 : 5;
  const transport = distKm<1 ? 'Excellent — right in the town centre'
    : distKm<3 ? 'Good — short drive from the centre'
    : distKm<6 ? 'Fair — a bit out of town, may need investment'
    : 'Limited — remote plot, new transport links will be needed';
  return {
    id:'custom',
    name: town.name+' — Your Chosen Plot',
    kind:'Custom site',
    lat, lng, cost, ceiling, transport,
    desc:`A site you hand-picked ${distKm.toFixed(1)}km from the town centre. Cost, ceiling and transport reflect exactly where you dropped the pin.`
  };
}

function socialHandle(){
  const g = state.game;
  return '@'+(g.club.shortName||g.club.name||'club').replace(/\s+/g,'').slice(0,15);
}
function suggestedSocialPosts(){
  const g = state.game;
  const list = [];
  const form = g.club.form||[];
  const last = form[form.length-1];
  const tag = '#'+(g.club.shortName||g.club.nickname||g.club.name||'club').replace(/\s+/g,'');
  if(last==='W') list.push(`WHAT A WIN! 🔵⚪ Three points on the board and the whole town buzzing tonight. ${tag}`);
  else if(last==='L') list.push(`Tough result today — heads stay up. Back on the training ground this week, stronger for the next one. 💪`);
  else if(last==='D') list.push(`A point earned the hard way today. Not quite what we wanted, but the fight was there till the whistle.`);
  const fixture = g.fixtures[g.week];
  if(fixture){
    const oppName = (findRival(fixture.oppId)||{}).name || ((g.league||[]).find(c=>c.id===fixture.oppId)||{}).name || 'our next opponents';
    list.push(`${fixture.home?'HOME':'AWAY'} this week vs ${oppName}. Who's with us? 🙌 #MatchDay`);
  }
  list.push(`Massive thank you to every fan who comes through the gates at ${g.club.stadiumName||'our ground'} — this club is nothing without you. ❤️`);
  list.push(`Development work continues around the ground in ${g.town.name} — exciting times ahead for the club and the town. 🏗️`);
  list.push(`Behind the scenes at training this week — the squad is putting the work in. ${tag}`);
  return list.slice(0,4);
}
function publishSocialPost(text){
  const g = state.game;
  if(!text || !text.trim()) return;
  const followers = state.socialFollowers;
  const likes = Math.max(1, Math.round(followers*(0.03+Math.random()*0.14)));
  const newFollowers = Math.max(0, Math.round(likes*0.12 + Math.random()*4));
  state.socialFollowers += newFollowers;
  const replyPool = [
    "Can't wait for the weekend! 🔵", "This club means everything to this town.",
    "Get the tickets on sale already!", "Someone tell the board we need a new striker 😅",
    "Proper buzzing for this one.", "Been following since day one, love this.",
    "Get in!!", "This is why we love this club."
  ];
  const reply = replyPool[Math.floor(Math.random()*replyPool.length)];
  const replyAuthor = '@fan'+Math.floor(Math.random()*9999);
  state.socialPosts.unshift({week:g.week, text:text.trim(), likes, replyAuthor, reply});
  if(state.socialPosts.length>40) state.socialPosts.length=40;
  g.club.reputation = Math.min(100, g.club.reputation + 0.3);
  save();
}

  canvas.width=640; canvas.height=320; canvas.style.width='100%'; canvas.style.maxWidth='640px';
  canvasCard.appendChild(canvas);
  wrap.appendChild(canvasCard);

  const standCard = el(`<div class="card"><h3>Stands</h3><div class="stand-grid"></div></div>`);
  const grid = $('.stand-grid', standCard);
  ['north','south','east','west'].forEach(side=>{
    const tierIdx = g.club.stands[side];
    const tier = STAND_TIERS[tierIdx]; const next = STAND_TIERS[tierIdx+1];
    const card = el(`<div class="stand-card"><h4>${side} Stand</h4><div class="tier">${tier.name} · ${tier.cap.toLocaleString()} seats</div>
      ${next?`<button data-upgrade="${side}">Upgrade to ${next.name} (£${next.cost.toLocaleString()})</button>`:`<span class="muted">Fully developed</span>`}</div>`);
    grid.appendChild(card);
  });
  wrap.appendChild(standCard);
  wrap.appendChild(el(`<div class="card"><h3>Site</h3>
    <div class="finance-line"><span>Ground</span><span>${g.site.name}</span></div>
    <div class="finance-line"><span>Site type</span><span>${g.site.kind}</span></div>
    <div class="finance-line"><span>Transport</span><span>${g.site.transport}</span></div>
  </div>`));
  setTimeout(()=>drawStadium(canvas),0);
  return wrap;
}
function drawStadium(canvas){
  const g = state.game, ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0f1622'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2, pitchW=260, pitchH=140;
  const sideDefs=[{side:'north',dy:-1},{side:'south',dy:1},{side:'east',dx:1},{side:'west',dx:-1}];
  sideDefs.forEach(sd=>{
    const tierIdx=g.club.stands[sd.side]; const height=14+tierIdx*14;
    ctx.fillStyle = tierIdx>=4?'#E8C158':(tierIdx>=2?'#3DA5D9':'#3a4558');
    if(sd.dy!==undefined){ const w=pitchW+30, x=cx-w/2, y=sd.dy<0?cy-pitchH/2-height-6:cy+pitchH/2+6; ctx.fillRect(x,y,w,height); }
    else { const h=pitchH+30, y=cy-h/2, x=sd.dx<0?cx-pitchW/2-height-6:cx+pitchW/2+6; ctx.fillRect(x,y,height,h); }
  });
  ctx.fillStyle='#2E7D46'; ctx.fillRect(cx-pitchW/2,cy-pitchH/2,pitchW,pitchH);
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2; ctx.strokeRect(cx-pitchW/2,cy-pitchH/2,pitchW,pitchH);
  ctx.beginPath(); ctx.moveTo(cx,cy-pitchH/2); ctx.lineTo(cx,cy+pitchH/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,26,0,Math.PI*2); ctx.stroke();
}
function bindStadiumEvents(){
  $all('[data-upgrade]').forEach(btn=>btn.addEventListener('click', ()=>{
    const side = btn.getAttribute('data-upgrade'), g = state.game, tierIdx = g.club.stands[side], next = STAND_TIERS[tierIdx+1];
    if(!next) return;
    if(g.club.cash<next.cost){ alert('Not enough cash for this upgrade.'); return; }
    g.club.cash -= next.cost; g.club.stands[side]=tierIdx+1;
    g.news.unshift({wk:g.week, text:`The ${side} stand is redeveloped into a ${next.name}, boosting capacity to ${totalCapacity().toLocaleString()}.`});
    save(); render();
  }));
}

function cityExpansionCost(){ return 30000 + (state.game.cityGridSize-7)*20000; }
function cityExpansionCapReq(){ return 4000 + (state.game.cityGridSize-7)*4000; }
function expandCity(){
  const g = state.game;
  const newSize = g.cityGridSize+2;
  const grid = [];
  for(let y=0;y<newSize;y++){ const row=[]; for(let x=0;x<newSize;x++) row.push('empty'); grid.push(row); }
  const offset = Math.floor((newSize-g.cityGridSize)/2);
  for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){ grid[y+offset][x+offset]=g.cityGrid[y][x]; }
  g.cityGrid = grid; g.cityGridSize = newSize;
  g.news.unshift({wk:g.week, text:`With the stadium drawing bigger crowds, the council approves expanding the club's footprint in ${g.town.name} — more land is now available to develop around the ground.`});
}

function renderCity(){
  const g = state.game;
  const wrap = el(`<div class="card"><h3>${g.town.name} — Town Development</h3>
    <p class="muted">Place tiles around the stadium (centre). Roads and transport reduce traffic; housing, shops and hospitality generate weekly rent income.</p></div>`);
  const cap = totalCapacity();
  const capReq = cityExpansionCapReq();
  const expandCost = cityExpansionCost();
  const canExpand = cap>=capReq;
  wrap.appendChild(el(`<div class="card" style="border-left-color:var(--gold);">
    <h3>District Size: ${g.cityGridSize}×${g.cityGridSize}</h3>
    <p class="muted">As your stadium capacity grows, the council releases more surrounding land for development.</p>
    ${canExpand
      ? `<button id="expand-city">Expand District to ${g.cityGridSize+2}×${g.cityGridSize+2} (£${expandCost.toLocaleString()})</button>`
      : `<p class="muted">Reach ${capReq.toLocaleString()} capacity to unlock the next expansion (currently ${cap.toLocaleString()}).</p>`}
  </div>`));
  const palette = el(`<div class="tile-palette"></div>`);
  Object.entries(CITY_TILE_TYPES).forEach(([key,def])=>{
    if(key==='empty') return;
    const discount = g.club.cityDiscount||0;
    const cost = Math.round(def.cost*(1-discount));
    const btn = el(`<button class="tile-btn ${g.selectedCityTile===key?'sel':''}" data-tile="${key}"><span class="tile-swatch" style="background:${def.color}"></span>${def.label}<br><span class="muted">£${cost.toLocaleString()}</span></button>`);
    palette.appendChild(btn);
  });
  palette.appendChild(el(`<button class="tile-btn ghost" data-tile="empty">Clear Tile</button>`));
  wrap.appendChild(palette);
  const canvas = document.createElement('canvas');
  const cellPx=64; canvas.width=g.cityGridSize*cellPx; canvas.height=g.cityGridSize*cellPx*0.55+40; canvas.style.maxWidth='100%';
  wrap.appendChild(canvas);
  wrap.appendChild(el(`<div class="muted" style="margin-top:8px;">Weekly rent/property income: £${cityIncome().toLocaleString()} · Traffic ${Math.round(g.townStats.traffic)}/100 · Town happiness ${Math.round(g.townStats.happiness)}/100</div>`));
  setTimeout(()=>drawCity(canvas,cellPx),0);
  return wrap;
}
function isoProject(gx,gy,cellPx,originX,originY){ return [originX+(gx-gy)*cellPx/2, originY+(gx+gy)*cellPx/4]; }
function drawCity(canvas,cellPx){
  const g = state.game, ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const originX=canvas.width/2, originY=20, tileW=cellPx, tileH=cellPx/2;
  for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){
    const [sx,sy]=isoProject(x,y,cellPx,originX,originY);
    const type=g.cityGrid[y][x], isStadium=type==='stadium';
    const def = isStadium?{color:'#E8C158'}:(CITY_TILE_TYPES[type]||CITY_TILE_TYPES.empty);
    drawIsoTile(ctx,sx,sy,tileW,tileH,def.color);
    if(isStadium){ ctx.fillStyle='#0A0D13'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center'; ctx.fillText('STADIUM',sx,sy+4); }
  }
}
function drawIsoTile(ctx,cx,cy,w,h,color){
  ctx.beginPath(); ctx.moveTo(cx,cy-h/2); ctx.lineTo(cx+w/2,cy); ctx.lineTo(cx,cy+h/2); ctx.lineTo(cx-w/2,cy); ctx.closePath();
  ctx.fillStyle=color; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1; ctx.stroke();
}
function bindCityEvents(){
  $('#expand-city')?.addEventListener('click', ()=>{
    const g = state.game, cost = cityExpansionCost();
    if(g.club.cash<cost){ alert('Not enough cash for this expansion.'); return; }
    g.club.cash -= cost; expandCity(); save(); render();
  });
  $all('[data-tile]').forEach(btn=>btn.addEventListener('click', ()=>{ state.game.selectedCityTile=btn.getAttribute('data-tile'); render(); }));
  const canvas = $('canvas', $('.content')); if(!canvas) return;
  canvas.addEventListener('click',(e)=>{
    const g = state.game, rect = canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    const mx=(e.clientX-rect.left)*scaleX, my=(e.clientY-rect.top)*scaleY;
    const cellPx=canvas.width/g.cityGridSize, originX=canvas.width/2, originY=20;
    let best=null, bestDist=Infinity;
    for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){
      const [sx,sy]=isoProject(x,y,cellPx,originX,originY); const d=Math.hypot(sx-mx,sy-my);
      if(d<bestDist){bestDist=d; best={x,y};}
    }
    if(!best || g.cityGrid[best.y][best.x]==='stadium') return;
    const tileKey=g.selectedCityTile, def=CITY_TILE_TYPES[tileKey];
    if(tileKey!=='empty'){
      const cost = Math.round(def.cost*(1-(g.club.cityDiscount||0)));
      if(g.club.cash<cost){ alert('Not enough cash for this development.'); return; }
      g.club.cash -= cost;
    }
    g.cityGrid[best.y][best.x]=tileKey; save(); render();
  });
}

function renderAcademy(){

    <div class="finance-line"><span>Academy Quality</span><span>${Math.round(g.club.academyQuality)}/100</span></div>

}

function renderFinances(){
  const g = state.game; const wrap = el(`<div></div>`);
  const summary = el(`<div class="card"><h3>Weekly Finance Report</h3></div>`);
  const last = g.financeLog[g.financeLog.length-1];
  if(last){
    [['Sponsorship',last.sponsorship,1],['Merchandise',last.merch,1],['Property/rent income',last.propertyIncome,1],
     ['Wages',last.wages,-1],['Stadium maintenance',last.maintenance,-1],['Debt interest',last.debtInterest,-1]].forEach(([lbl,val,sign])=>{
      summary.appendChild(el(`<div class="finance-line"><span>${lbl}</span><span>${sign<0?'-':''}£${val.toLocaleString()}</span></div>`));
    });
    summary.appendChild(el(`<div class="finance-line total"><span>Net (excl. matchday gate)</span><span>${last.net>=0?'+':''}£${last.net.toLocaleString()}</span></div>`));
  } else summary.appendChild(el(`<p class="muted">No finance history yet — press Continue to generate your first report.</p>`));
  wrap.appendChild(summary);
  wrap.appendChild(el(`<div class="card"><h3>Ticket Pricing</h3>
    <div class="field" style="max-width:220px;"><label>Adult Matchday Price: <b style="color:var(--accent-light)">£${g.club.ticketPrice}</b></label>
    <input type="range" id="ticket-slider" min="4" max="60" value="${g.club.ticketPrice}"></div>
    <p class="muted">Higher prices raise revenue per fan but reduce attendance demand.</p></div>`));
  const historyCard = el(`<div class="card"><h3>Recent Weeks</h3></div>`);
  const t2 = el(`<table><thead><tr><th>Wk</th><th>Income</th><th>Expenses</th><th>Net</th></tr></thead><tbody></tbody></table>`);
  [...g.financeLog].reverse().forEach(r=>{
    t2.querySelector('tbody').appendChild(el(`<tr><td>${r.week}</td><td>£${r.income.toLocaleString()}</td><td>£${r.expenses.toLocaleString()}</td><td>${r.net>=0?'+':''}£${r.net.toLocaleString()}</td></tr>`));

  historyCard.appendChild(t2); wrap.appendChild(historyCard);

function bindFinanceEvents(){ $('#ticket-slider')?.addEventListener('input', e=>{ state.game.club.ticketPrice=Number(e.target.value); render(); }); }

function renderStaff(){

    <button id="staff-upgrade" style="margin-top:10px;">Hire Better Staff (£${staffUpgradeCost().toLocaleString()})</button>

}

function renderRivals(){

/* ---------------- Boot ---------------- */
window.addEventListener('error', function(e){
  console.error('Chairman & City error:', e.error || e.message);
  const app=document.getElementById('app');
  if(app && !app.children.length){
    app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:#0A0D13;color:#EDEFF4;font-family:Segoe UI,Arial"><div style="max-width:760px;background:#121826;border:1px solid #3a4558;border-radius:16px;padding:28px"><h1 style="margin:0 0 10px;color:#FF7A29">Chairman & City could not start</h1><p style="color:#8C94A6">A browser error stopped the game from loading.</p><pre style="white-space:pre-wrap;color:#EDEFF4;background:#0A0D13;padding:14px;border-radius:8px">'+String(e.message||e.error||'Unknown error')+'</pre><button onclick="location.reload()" style="padding:12px 18px">Reload Game</button></div></div>';
  }
});

// Use browser localStorage for standalone HTML files. This avoids relying on
// platform-specific storage APIs that do not exist when the file is opened directly.
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e) { console.warn('Save unavailable:', e); }
}
function loadSaveSync(){
  try {
    const value=localStorage.getItem(STORAGE_KEY);
    if(!value) return false;
    const parsed=JSON.parse(value);
    if(parsed && typeof parsed==='object' && parsed.club && parsed.chairman){ state=parsed; return true; }
  } catch(e) {
    try { localStorage.removeItem(STORAGE_KEY); } catch(_) {}
  }
  return false;
}
function resetGame(){
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  state=freshState();
  render();
}

try {
  if(!loadSaveSync()) state=freshState();
  state.musicOn = false; // never auto-resume audio without a fresh user gesture
  render();
} catch(err) {
  console.error('Chairman & City startup error:', err);
  const app=document.getElementById('app');
  if(app) app.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:#0A0D13;color:#EDEFF4;font-family:Segoe UI,Arial"><div style="max-width:760px;background:#121826;border:1px solid #3a4558;border-radius:16px;padding:28px"><h1 style="margin:0 0 10px;color:#FF7A29">Chairman & City could not start</h1><p style="color:#8C94A6">The game hit an error while creating the first screen.</p><pre style="white-space:pre-wrap;color:#EDEFF4;background:#0A0D13;padding:14px;border-radius:8px">'+String(err.stack||err)+'</pre><button onclick="location.reload()" style="padding:12px 18px">Reload Game</button></div></div>';
  }
</script>
