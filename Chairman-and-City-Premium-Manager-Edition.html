      outer.querySelector('#me-demand-results').onclick=()=>{g.managerMode.boardConfidence=clamp(g.managerMode.boardConfidence-2,0,100);g.managerMode.objectives.forEach(x=>x.progress=clamp(x.progress+5,0,100));save();toast('Board expectations raised.');render();};
      outer.querySelectorAll('[data-office-style]').forEach(s=>s.addEventListener('click',()=>{state.game.club.office.style=s.getAttribute('data-office-style');save();render();}));
      outer.querySelectorAll('[data-office-upgrade]').forEach(s=>s.addEventListener('click',()=>{const x=state.game, L=OFFICE_LEVELS[parseInt(s.getAttribute('data-office-upgrade'),10)-1]; if(!L||x.club.office.level>=L.level) return; if(x.club.reputation<L.rep){alert('Your reputation is too low for the board to justify this office.');return;} if(x.club.cash<L.cost){alert('Not enough cash.');return;} x.club.cash-=L.cost; x.club.office.level=L.level; x.news.unshift({wk:x.week,text:'The '+L.name+' opens its doors — your new chairman\'s office is ready.'}); SFX.success(); save(); render();}));
      outer.querySelectorAll('[data-office-feat]').forEach(s=>s.addEventListener('click',()=>{const x=state.game, f=OFFICE_FEATURES.find(y=>y.id===s.getAttribute('data-office-feat')); if(!f) return; if(x.club.office.level<f.needLevel){alert('Upgrade your office level first.');return;} if(x.club.cash<f.cost){alert('Not enough cash.');return;} x.club.cash-=f.cost; x.club.office.features[f.id]=true; x.news.unshift({wk:x.week,text:'A '+f.name+' is fitted in your office.'}); SFX.success(); save(); render();}));
    },0);
    return outer;
  };

  /* Replace the main dashboard with a cleaner, information-dense home screen. */
  window.renderDashboard=function(){
    ensureManagerState(); const g=state.game;
    const fixture=g.fixtures[g.week];
    const opp=fixture?(findRival(fixture.oppId)?.name||g.league.find(c=>c.id===fixture.oppId)?.name||'Opponent'):null;
    const layout=document.createElement('div'); layout.className='me-shell';
    layout.innerHTML=`<div class="me-topline">
      <div class="me-brand"><div class="me-crest" style="background:${g.club.primary};color:${g.club.secondary}">${badgeSvgSmall(g.club)}</div><div><div class="me-brand-title">${g.club.name}</div><div class="me-brand-sub">${TIERS[g.club.tier]} · Season ${g.season} · Week ${g.week}/${g.seasonWeeks}</div></div></div>
      <div class="me-topstats">
        <div class="me-stat"><small>Cash</small><b>${money(g.club.cash)}</b></div>
        <div class="me-stat"><small>Reputation</small><b>${Math.round(g.club.reputation)}/100</b></div>
        <div class="me-stat"><small>Staff</small><b>${staffScore()}/100</b></div>
        <button class="continue-btn me-continue" id="advance-btn">${g.pendingEvent?'<span class="dot"></span>':''}Continue ▸</button>
      </div></div>
      <div class="me-layout"><aside class="me-side"><div class="me-side-label">Club</div><div class="me-nav" id="me-nav"></div>
      <div class="me-side-card"><div class="row"><span>Manager</span><b>${g.club.managerName?'✓':'Vacant'}</b></div><div class="row"><span>System</span><b>${managerStyleName(g.managerMode.tactic)}</b></div><div class="row"><span>Board</span><b>${g.managerMode.boardConfidence}%</b></div></div></aside>
      <main class="me-main" id="main-content"></main></div>`;
    const nav=layout.querySelector('#me-nav');
    NAV_ITEMS.forEach(([key,label])=>{
      const desc={overview:'Club dashboard',football:'Fixtures & league',squad:'First team & contracts',tactics:'Identity & match plan',recruitment:'Scouting & transfers',staff:'Manager & backroom',academy:'Youth pathway',finances:'Budgets & commercial',stadium:'Ground & facilities',clubs:'Club directory',rivals:'Derbies & diplomacy',social:'Supporters & media',chairman:'Objectives & confidence',history:'Records & legacy',settings:'Save & audio'}[key]||'';
      const b=document.createElement('button');b.className=state.dashTab===key?'active':'';b.dataset.nav=key;b.innerHTML=`<span class="ico">${({overview:'⌂',football:'⚽',squad:'👥',tactics:'🎯',recruitment:'🔎',staff:'🧠',academy:'⭐',finances:'£',stadium:'🏟',clubs:'🌍',rivals:'⚔',social:'◉',chairman:'♜',history:'↺',settings:'⚙'}[key]||'•')}</span><span class="copy"><b>${label}</b><span>${desc}</span></span>`;b.onclick=()=>{state.dashTab=key;SFX.select();render();};nav.appendChild(b);
    });
    const main=layout.querySelector('#main-content');
    main.appendChild(renderTab(state.dashTab));
    setTimeout(()=>{layout.querySelector('#advance-btn')?.addEventListener('click',tickWeek);bindTabEvents(state.dashTab);},0);
    return layout;
  };

  const originalRenderTab=window.renderTab;
  window.renderTab=function(tab){
    if(tab==='tactics')return renderTactics();
    if(tab==='recruitment')return renderRecruitment();
    if(tab==='chairman')return renderBoardroom();
    return originalRenderTab(tab);
  };

  /* Make the weekly simulation acknowledge the deeper staff department. */
  const oldTick=window.tickWeek;
  window.tickWeek=function(){
    ensureManagerState();
    const g=state.game;
    const before=g.club.staffQuality||25;
    const impact=staffImpact();
    g.club.staffQuality=clamp(before+impact*.015,1,100);
    g.managerMode.morale=clamp(g.managerMode.morale+(g.club.managerName?1:-2),0,100);
    g.managerMode.boardConfidence=clamp(g.managerMode.boardConfidence+(g.club.wins>g.club.losses?1:-.4)+officeEffects().board,0,100);
    if(g.managerMode.objectives?.length){
      g.managerMode.objectives[0].progress=clamp(g.managerMode.objectives[0].progress+(g.club.wins>g.club.losses?2:0),0,100);
      g.managerMode.objectives[1].progress=clamp(g.managerMode.objectives[1].progress+(g.club.cash>0?1:0),0,100);
    }
    oldTick();
  };

  /* Upgrade the existing procedural audio with a subtle crowd bed. */
  const oldStart=AudioEngine.start.bind(AudioEngine);
  AudioEngine.start=function(){
    oldStart();
    if(!this.ctx||this._crowd) return;
    const buffer=this.ctx.createBuffer(1,this.ctx.sampleRate*2,this.ctx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<data.length;i++) data[i]=(Math.random()*2-1)*0.12;
    const src=this.ctx.createBufferSource(); src.buffer=buffer; src.loop=true;
    const filter=this.ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=950;
    const gain=this.ctx.createGain(); gain.gain.value=.018;
    src.connect(filter);filter.connect(gain);gain.connect(this.master);src.start();
    this._crowd={src,gain};
  };
  const oldStop=AudioEngine.stop.bind(AudioEngine);
  AudioEngine.stop=function(){
    if(this._crowd){try{this._crowd.src.stop()}catch(e){}this._crowd=null;}
    oldStop();
  };

  /* Migration for existing saves. */
  try{ensureManagerState();}catch(e){console.warn('Manager Edition migration:',e);}
})();
</script>
