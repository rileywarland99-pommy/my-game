<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Chairman &amp; City — Manager Edition</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#0A0D13; --panel:#121826; --panel2:#1A2233; --panel3:#232D42;
    --accent:#FF7A29; --accent-light:#FFA35C; --accent2:#3DA5D9;
    --text:#EDEFF4; --text-dim:#8C94A6; --good:#3DBE6C; --bad:#E5484D;
    --divider:rgba(237,239,244,0.09); --gold:#E8C158;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-0.01em;}
  button{font-family:inherit;cursor:pointer;border:none;background:var(--accent);
    color:#060a12;font-weight:700;padding:10px 16px;font-size:13px;border-radius:8px;
    transition:transform .1s ease, background .15s ease, box-shadow .15s ease;min-height:38px;}
  button:hover{background:var(--accent-light);box-shadow:0 0 0 3px rgba(0,180,255,.15);transform:translateY(-1px);}
  button:active{transform:scale(0.97);}
  button:disabled{background:#1a2332;color:#4a5568;cursor:not-allowed;box-shadow:none;}
  button.ghost{background:rgba(255,255,255,.05);border:1px solid var(--divider);color:var(--text);}
  button.ghost:hover{background:rgba(255,255,255,.1);box-shadow:none;transform:none;}
  button.danger-btn{background:var(--bad);color:#fff;}
  button.small{padding:6px 10px;font-size:11.5px;min-height:30px;}
  button.chip{background:var(--panel3);color:var(--text);font-weight:600;border-radius:20px;padding:6px 14px;}
  button.chip.on{background:var(--accent);color:#060a12;}
  a.skip-link{position:absolute;left:-999px;top:0;background:var(--accent);color:#1A0F06;padding:10px 16px;z-index:500;font-weight:700;border-radius:0 0 6px 0;}
  a.skip-link:focus{left:0;}
  input,select,textarea{font-family:inherit;background:var(--panel2);border:1px solid var(--divider);
    color:var(--text);padding:9px 10px;font-size:13px;border-radius:3px;}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--accent);}
  input[type=color]{padding:2px;height:38px;width:56px;}
label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;color:var(--text-dim);display:block;margin-bottom:5px;font-weight:700;}
.dropdown-menu{width:100%;cursor:pointer;appearance:none;-webkit-appearance:none;background:var(--panel2) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%23888'/%3E%3C/svg%3E") no-repeat right 10px center;background-size:10px 6px;padding-right:28px;font-weight:700;}
.dropdown-menu.small-dd{width:auto;min-width:150px;font-size:12px;padding:6px 28px 6px 8px;}
.dd-colour{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:-1px;background:#888;}
  .field{margin-bottom:14px;}
  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > .field{flex:1;min-width:150px;}
  [role="button"]:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible{
    outline:3px solid var(--accent2); outline-offset:2px;}

  .onboard-wrap{max-width:980px;margin:0 auto;padding:36px 20px 90px;}
  .hero{margin-bottom:24px;}
  .hero .kicker{color:var(--accent);font-weight:800;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;}
  .hero h1{font-size:38px;background:var(--fc-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--text-dim);max-width:600px;margin-top:10px;font-size:14.5px;line-height:1.55;}
  .step-indicator{display:flex;gap:6px;margin-bottom:26px;}
  .step-indicator span{flex:1;height:4px;background:var(--panel3);border-radius:2px;}
  .step-indicator span.done{background:var(--accent);}
  .panel{background:var(--panel);border:1px solid var(--divider);border-left:4px solid var(--accent);
    padding:24px 26px;margin-bottom:18px;border-radius:10px;}
  .panel h3{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);margin-bottom:18px;}
  .swatch-row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .kit-preview{width:64px;height:78px;position:relative;flex-shrink:0;}
  .kit-preview .body{position:absolute;inset:0;clip-path:polygon(20% 0,80% 0,100% 25%,85% 30%,85% 100%,15% 100%,15% 30%,0 25%);}
  .kit-preview .pattern{position:absolute;inset:0;clip-path:polygon(20% 0,80% 0,100% 25%,85% 30%,85% 100%,15% 100%,15% 30%,0 25%);}
  .kit-label{font-size:10.5px;color:var(--text-dim);text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:0.06em;}
  .badge-preview{width:74px;height:74px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
  .choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .choice-card{background:var(--panel2);border:1px solid var(--divider);padding:12px;cursor:pointer;border-radius:8px;text-align:center;transition:border-color .15s,background .15s;}
  .choice-card:hover{border-color:var(--accent);}
  .choice-card.sel{border-color:var(--accent);background:var(--panel3);box-shadow:0 0 0 1px var(--accent);}
  .choice-card h4{font-size:12.5px;text-transform:none;color:var(--text);}
  .choice-card p{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.35;}
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;}
  .mode-card{background:var(--panel2);border:1px solid var(--divider);padding:15px;cursor:pointer;border-radius:10px;transition:border-color .15s,background .15s,transform .15s;}
  .mode-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .mode-card.sel{border-color:var(--accent);background:var(--panel3);box-shadow:0 0 0 1px var(--accent);}
  .mode-card h4{color:var(--accent);font-size:14px;text-transform:uppercase;letter-spacing:0.03em;}
  .mode-card p{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.4;}
  .big-choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
  .big-choice{background:var(--panel2);border:1px solid var(--divider);padding:22px;border-radius:10px;cursor:pointer;transition:border-color .15s,transform .15s;}
  .big-choice:hover{border-color:var(--accent);transform:translateY(-2px);}
  .big-choice h3{color:var(--accent);font-size:16px;text-transform:none;margin-bottom:8px;}
  .big-choice p{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .custom-toggle{margin-top:14px;font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:8px;}
  .slider-field{margin-bottom:12px;}
  .slider-field .val{color:var(--accent-light);font-weight:700;float:right;}
  input[type=range]{width:100%;accent-color:var(--accent);min-height:30px;}
  .avatar-svg{border-radius:50%;background:var(--panel2);}
  .swatch-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .swatch-dot.sel{border-color:var(--accent);}
  .swatch-dot.wide{width:40px;height:26px;border-radius:6px;}
  .custom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;align-items:start;}
  .office-card .row{flex-wrap:wrap;}
  .office-room{position:relative;height:176px;border-radius:10px;overflow:hidden;margin-top:12px;
    background:linear-gradient(180deg,var(--om-wall) 0%,var(--om-wall) 54%,var(--om-floor) 54.5%,var(--om-floor) 100%);
    border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 -14px 24px rgba(0,0,0,.35);}
  .office-room .opt-halo{position:absolute;left:22%;top:34px;width:150px;height:80px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--om-accent) 28%,transparent),transparent 70%);filter:blur(4px);}
  .office-room .opt-window{position:absolute;left:16px;top:14px;width:104px;height:80px;border-radius:6px;border:3px solid rgba(255,255,255,.16);overflow:hidden;background:linear-gradient(180deg,#0a1424,#152238);}
  .office-room .opt-sky{position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(circle at 30% 22%,color-mix(in srgb,var(--om-accent) 36%,transparent),transparent 60%);}
  .office-room .opt-skyline{position:absolute;left:0;right:0;bottom:0;height:26px;opacity:.85;clip-path:polygon(0 100%,0 40%,8% 40%,8% 62%,16% 62%,16% 22%,24% 22%,24% 48%,32% 48%,32% 60%,40% 60%,40% 30%,48% 30%,48% 55%,56% 55%,56% 20%,64% 20%,64% 50%,72% 50%,72% 58%,80% 58%,80% 36%,88% 36%,88% 52%,100% 52%,100% 100%);}
  .office-room .opt-sofa{position:absolute;right:120px;bottom:16px;font-size:34px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));}
  .office-room .opt-desk{position:absolute;right:30px;bottom:10px;width:110px;height:34px;border-radius:4px;box-shadow:inset 0 3px 0 rgba(255,255,255,.14),0 4px 8px rgba(0,0,0,.45);}
  .office-room .opt-chair{position:absolute;right:76px;bottom:24px;}
  .office-room .opt-plant{position:absolute;left:150px;bottom:14px;font-size:32px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));}
  .office-room .opt-art{position:absolute;left:248px;top:16px;font-size:32px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
  .office-room .opt-art:before{content:'';position:absolute;left:-6px;top:-6px;right:-6px;bottom:-6px;border:3px solid color-mix(in srgb,var(--om-accent) 65%,transparent);border-radius:4px;}
  .office-room .opt-trophy{position:absolute;right:168px;bottom:16px;font-size:30px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));}
  .office-room .opt-coffee{position:absolute;right:26px;bottom:50px;font-size:26px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));}
  .office-room .opt-monitor{position:absolute;left:120px;bottom:16px;font-size:28px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
  .office-room .opt-fridge{position:absolute;right:10px;bottom:12px;font-size:30px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
  .opt-style{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text-dim);cursor:pointer;border:2px solid transparent;border-radius:8px;padding:6px;min-width:66px;background:var(--panel2);}
  .opt-style .chip{width:36px;height:22px;border-radius:5px;}
  .opt-style.sel{border-color:var(--accent);color:var(--text);}
  .office-levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin-top:6px;}
  .opt-lvl{background:var(--panel2);border:1px solid var(--divider);border-radius:8px;padding:8px;text-align:center;}
  .opt-lvl b{display:block;font-size:12px;color:var(--text);}
  .opt-lvl small{color:var(--text-dim);font-size:11px;}
  .opt-lvl.owned{border-color:rgba(96,200,120,.45);}
  .opt-lvl.next{border-color:var(--accent);cursor:pointer;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 22%,transparent);}
  .opt-feat{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--divider);border-radius:8px;padding:10px;flex:1 1 210px;min-width:205px;}
  .opt-feat .opt-feat-ico{font-size:22px;line-height:1;}
  .opt-feat b{font-size:12.5px;color:var(--text);}
  .opt-feat small{display:block;color:var(--text-dim);font-size:11px;margin-top:2px;line-height:1.4;}
  .opt-feat.owned{border-color:rgba(96,200,120,.45);}
  .opt-feat[role="button"]{cursor:pointer;}
  .opt-feat[role="button"]:hover{border-color:var(--accent);}

  .map-shell{max-width:1240px;margin:0 auto;padding:18px 20px 90px;position:relative;}
  .breadcrumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-dim);margin-bottom:14px;flex-wrap:wrap;
    position:relative;z-index:4;background:rgba(8,13,21,.6);backdrop-filter:blur(12px) saturate(1.3);-webkit-backdrop-filter:blur(12px) saturate(1.3);
    padding:8px 13px;border-radius:10px;border:1px solid rgba(255,255,255,.08);align-self:flex-start;}
  .breadcrumb b{color:var(--text);cursor:pointer;background:none;border:none;font:inherit;padding:2px 4px;}
  .breadcrumb b:hover{color:var(--accent-light);}
  .breadcrumb .sep{color:var(--panel3);}
  .map-shell .hero{position:relative;z-index:3;background:linear-gradient(180deg,rgba(8,13,21,.85),rgba(8,13,21,.5));
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:14px;
    padding:16px 18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.28);}
  .map-shell .hero p{max-width:700px;margin-top:6px;}
  .map-wrap{position:relative;border-radius:16px;overflow:hidden;height:clamp(360px,62vh,620px);
    border:1px solid rgba(255,255,255,.1);background:#0a101d;box-shadow:0 26px 70px rgba(0,0,0,.45);}
  #leaflet-map{position:absolute;inset:0;background:#0a101d;}
  .side-panel{position:absolute;z-index:2;top:14px;right:14px;bottom:14px;width:min(400px,92vw);overflow:auto;
    background:rgba(8,13,21,.66);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    border:1px solid rgba(255,255,255,.11);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;
    box-shadow:0 14px 40px rgba(0,0,0,.35);}
  .side-panel .panel{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.1);}
  .loc-chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);padding:11px 13px;display:flex;
    justify-content:space-between;align-items:center;cursor:pointer;border-radius:10px;transition:border-color .15s,background .15s;}
  .loc-chip:hover{border-color:var(--accent);background:rgba(0,180,255,.07);}
  .loc-chip.active{border-color:var(--accent);background:rgba(0,180,255,.12);}
  .loc-chip .name{font-weight:700;font-size:13.5px;}
  .loc-chip .sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--text);border-radius:6px;}
  .leaflet-popup-tip{background:var(--panel2);}
  #compare-zone .panel{position:relative;z-index:3;background:rgba(8,13,21,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.35);}
  .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:16px;}
  .stat-line{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--divider);gap:10px;}
  .stat-line b{color:var(--accent-light);text-align:right;}
  .site-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);padding:14px;border-radius:8px;margin-bottom:10px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
  .site-card:hover{border-color:var(--accent2);background:rgba(0,232,143,.05);}
  .site-card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .site-card h4{font-size:13.5px;color:var(--accent-light);}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .tag{font-size:10px;background:var(--panel3);color:var(--text-dim);padding:3px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:0.04em;}
  .map-shell .big-choice-grid{position:relative;z-index:3;}

  .masthead{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;gap:10px;flex-wrap:wrap;
    background:linear-gradient(180deg,#0d1526,#0a101d);border-bottom:1px solid rgba(0,180,255,.15);position:sticky;top:0;z-index:20;}
  .masthead-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .mh-crest{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid var(--gold);flex-shrink:0;background:var(--panel3);}
  .mh-name{font-size:15px;font-weight:800;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;color:#fff;}
  .mh-sub{font-size:11px;color:var(--text-dim);}
  .mh-bar{height:3px;width:120px;background:var(--panel3);border-radius:2px;margin-top:5px;overflow:hidden;}
  .mh-bar .fill{height:100%;background:var(--fc-gradient);}
  .masthead-stats{display:flex;gap:22px;}
  .mh-stat{text-align:right;}
  .mh-stat .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);}
  .mh-stat .v{font-size:14px;font-weight:800;color:var(--text);}
  .continue-btn{background:var(--accent);padding:11px 22px;font-size:13px;font-weight:800;border-radius:8px;display:flex;align-items:center;gap:8px;position:relative;color:#060a12;}
  .continue-btn .dot{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad);}
  .layout{display:flex;flex:1;min-height:0;}
  .rail{width:78px;flex-shrink:0;background:linear-gradient(180deg,#0c1424,#090f1b);border-right:1px solid rgba(255,255,255,.06);
    display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;}
  .rail-item{width:60px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
    border-radius:10px;cursor:pointer;color:var(--text-dim);transition:background .15s,color .15s,transform .1s;}
  .rail-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .rail-item span{font-size:9px;text-transform:uppercase;letter-spacing:0.03em;text-align:center;line-height:1.1;}
  .rail-item:hover{background:rgba(0,180,255,.08);color:var(--text);}
  .rail-item.active{background:rgba(0,180,255,.14);color:var(--accent-light);box-shadow:inset 3px 0 var(--accent),0 8px 24px rgba(0,0,0,.16);}
  .rail-item.active svg{stroke:var(--accent-light);}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:auto;}
  .content{padding:24px 28px;flex:1;max-width:1180px;width:100%;margin:0 auto;}
  .card{background:linear-gradient(145deg,rgba(21,29,46,.92),rgba(12,18,29,.95));border:1px solid var(--divider);
    padding:19px 21px;margin-bottom:18px;border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.2);transition:border-color .15s;}
  .card:hover{border-color:rgba(255,255,255,.15);}
  .card.accent-gold{border-top:2px solid var(--gold);}
  .card.accent-warn{border-top:2px solid var(--bad);}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);margin-bottom:15px;display:flex;align-items:center;gap:8px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-dim);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--divider);font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;}
  td{padding:7px 8px;border-bottom:1px solid var(--divider);}
  tr.player-row td{color:var(--accent-light);font-weight:700;background:rgba(255,122,41,0.08);}
  .news-item{padding:9px 0;border-bottom:1px solid var(--divider);font-size:12.5px;line-height:1.45;}
  .news-item .wk{color:var(--accent);font-weight:700;margin-right:6px;}
  .news-item.event{color:var(--gold);}
  .stand-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px;}
  .stand-card{background:var(--panel2);border:1px solid var(--divider);padding:13px;border-radius:6px;}
  .stand-card h4{font-size:12px;color:var(--accent-light);text-transform:uppercase;}
  .stand-card .tier{font-size:11px;color:var(--text-dim);margin:5px 0 10px;}
  .tile-palette{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .tile-btn{background:var(--panel2);border:1px solid var(--divider);padding:9px 11px;font-size:11px;color:var(--text);text-align:left;border-radius:5px;}
  .tile-btn.sel{border-color:var(--accent);background:var(--panel3);}
  .tile-swatch{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;border-radius:2px;}

<script>
/* =========================================================================
   CHAIRMAN & CITY v5 — Premium Edition
   Two career paths (found a club, or climb a board), a UK region with a deep
   London borough/postcode drill-down and an Australia region covering all
   states, satellite site selection, a manager transfer market, sponsor
   deals, academy prospects, rival diplomacy, a heuristic board advisor,
   deep club/chairman/stadium customisation, a social feed that scales with
   your following, procedural ambient audio, keyboard-accessible controls,
   and a mobile-responsive layout.
   All clubs, managers, prospects and sponsors are fictional; real towns,
   cities, states and suburbs are used only as a geographic backdrop.
   ========================================================================= */

const STORAGE_KEY = 'chairman-city-save-v5';
/* Offline canvas map */
let activeMap=null;
const MiniMap = {
  canvas:null, ctx:null, markers:[], center:[0,0], zoom:6, tooltip:null, onClick:null, resizeFn:null,
  init(containerId, center, zoom, opts){
    this.destroy();
    const container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML='';
    container.style.position='relative';
    const cvs = document.createElement('canvas');
    cvs.style.width='100%'; cvs.style.height='100%'; cvs.style.borderRadius='8px';
    container.appendChild(cvs);
    const tip = document.createElement('div');
    tip.style.cssText='position:absolute;top:8px;left:8px;background:rgba(10,14,20,.92);color:#e0e4ec;padding:8px 12px;border-radius:6px;font-size:11px;border:1px solid rgba(255,255,255,.1);display:none;pointer-events:none;z-index:5;max-width:220px;backdrop-filter:blur(6px);';
    container.appendChild(tip);
    this.canvas=cvs; this.ctx=cvs.getContext('2d'); this.center=center; this.zoom=zoom;
    this.tooltip=tip; this.onClick=opts?.onClick||null;
    this.resize();
    this.resizeFn=()=>{ if(this.canvas&&document.body.contains(this.canvas)) this.resize(); };
    window.addEventListener('resize',this.resizeFn);
    let dragStart=null, dragCenter=null, moved=false;
    cvs.addEventListener('mousedown',e=>{dragStart={x:e.clientX,y:e.clientY};dragCenter=[...this.center];moved=false;});
    cvs.addEventListener('mousemove',e=>{
      if(dragStart){
        const dx=(e.clientX-dragStart.x)/(this.canvas.width/4)*Math.pow(2,-this.zoom+6);
        const dy=(e.clientY-dragStart.y)/(this.canvas.height/4)*Math.pow(2,-this.zoom+6);
        if(Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)>3) moved=true;
        this.center=[dragCenter[0]-dy, dragCenter[1]+dx]; this.draw();
      } else {
        const rect=cvs.getBoundingClientRect();
        const mx=(e.clientX-rect.left)/rect.width*cvs.width;
        const my=(e.clientY-rect.top)/rect.height*cvs.height;
        let hit=null;
        for(const m of this.markers){ const [sx,sy]=this.project(m.lat,m.lng); if(Math.hypot(sx-mx,sy-my)<(m.radius||8)+4){hit=m;break;} }
        if(hit){
          tip.style.display='block'; tip.innerHTML=hit.html||hit.name||'';
          cvs.style.cursor='pointer';
        } else {
          tip.style.display='none'; cvs.style.cursor='grab';
        }
      }
    });
    cvs.addEventListener('mouseup',()=>{dragStart=null;});
    cvs.addEventListener('mouseleave',()=>{dragStart=null;tip.style.display='none';});
    cvs.addEventListener('click',e=>{
      if(moved) return;
      const rect=cvs.getBoundingClientRect();
      const mx=(e.clientX-rect.left)/rect.width*cvs.width;
      const my=(e.clientY-rect.top)/rect.height*cvs.height;
      for(const m of this.markers){ const [sx,sy]=this.project(m.lat,m.lng); if(Math.hypot(sx-mx,sy-my)<(m.radius||8)+4){if(m.onClick) m.onClick(); return;} }
      if(this.onClick) this.onClick();
    });
    cvs.addEventListener('wheel',e=>{ e.preventDefault(); this.zoom=Math.max(2,Math.min(18,this.zoom+(e.deltaY>0?-0.3:0.3))); this.draw(); },{passive:false});
    cvs.style.cursor='grab';
  },
  resize(){ if(!this.canvas||!this.canvas.parentElement) return; const r=this.canvas.parentElement.getBoundingClientRect();
    if(r.width<10||r.height<10){ this.canvas.width=600*(window.devicePixelRatio||1); this.canvas.height=360*(window.devicePixelRatio||1); this.draw(); return; }
    this.canvas.width=Math.round(r.width*window.devicePixelRatio); this.canvas.height=Math.round(r.height*window.devicePixelRatio); this.draw(); },
  project(lat,lng){
    const s=this.canvas.width, w=360/Math.pow(2,this.zoom), x=(lng+180)/360*s;
    const latR=lat*Math.PI/180, yH=Math.log(Math.tan(Math.PI/4+latR/2));
    const yPx=(1-yH/Math.PI)/2*s;
    const cx=(this.center[1]+180)/360*s;
    const cLatR=this.center[0]*Math.PI/180, cYH=Math.log(Math.tan(Math.PI/4+cLatR/2));
    const cy=(1-cYH/Math.PI)/2*s;
    return [x-cx+s/2, yPx-cy+this.canvas.height/2];
  },
  draw(){
    if(!this.ctx) return;
    const c=this.ctx, w=this.canvas.width, h=this.canvas.height, dpr=window.devicePixelRatio||1;
    c.clearRect(0,0,w,h);
    const bg=c.createLinearGradient(0,0,0,h);
    bg.addColorStop(0,'#0d1626'); bg.addColorStop(.5,'#0a111f'); bg.addColorStop(1,'#0b1424');
    c.fillStyle=bg; c.fillRect(0,0,w,h);
    c.strokeStyle='rgba(120,190,255,.07)'; c.lineWidth=dpr;
    for(let i=-180;i<=180;i+=30){ const [x]=this.project(0,i); c.beginPath(); c.moveTo(x,0); c.lineTo(x,h); c.stroke(); }
    for(let i=-80;i<=80;i+=20){ const [,y]=this.project(i,0); c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke(); }
    c.fillStyle='rgba(120,190,255,.05)';
    for(let i=-180;i<=180;i+=30){ for(let j=-80;j<=80;j+=20){ const [x,y]=this.project(j,i); if(x<-6||y<-6||x>w+6||y>h+6) continue; c.beginPath(); c.arc(x,y,1.6*dpr,0,Math.PI*2); c.fill(); } }
    c.save(); c.globalCompositeOperation='lighter';
    for(const m of this.markers){
      const [sx,sy]=this.project(m.lat,m.lng);
      if(sx<-120||sx>w+120||sy<-120||sy>h+120) continue;
      const r=(m.radius||7)*dpr, col=m.color||'#FF7A29';
      const glow=c.createRadialGradient(sx,sy,0,sx,sy,r*4.5);
      glow.addColorStop(0,col); glow.addColorStop(1,'rgba(0,0,0,0)');
      c.globalAlpha=(m.opacity||0.85)*.5; c.fillStyle=glow; c.beginPath(); c.arc(sx,sy,r*4.5,0,Math.PI*2); c.fill();
      c.globalAlpha=(m.opacity||0.85);
      c.beginPath(); c.arc(sx,sy,r,0,Math.PI*2);
      c.fillStyle=col; c.fill();
      c.strokeStyle='rgba(255,255,255,.35)'; c.lineWidth=dpr; c.stroke();
      c.globalAlpha=1;
    }
    c.restore();
    const vig=c.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);
    vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(3,7,14,.55)');
    c.fillStyle=vig; c.fillRect(0,0,w,h);
  },
  addMarker(lat,lng,opts){ this.markers.push({lat,lng,...opts}); },
  clearMarkers(){ this.markers=[]; },
  setView(center,zoom){ this.center=center; this.zoom=zoom; this.draw(); },
  destroy(){ if(this.resizeFn){ window.removeEventListener('resize',this.resizeFn); this.resizeFn=null; } this.canvas=null; this.ctx=null; this.markers=[]; this.tooltip=null; this.onClick=null; }
};

/* ---------------- Colour & pitch texture helpers ---------------- */
function shadeHex(hex,amt){
  if(typeof hex!=='string'||hex[0]!=='#') return hex;
  const n=parseInt(hex.slice(1),16); if(isNaN(n)) return hex;
  const r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt; const c=x=>Math.max(0,Math.min(255,x));
  return '#'+((c(r)<<16)|(c(g)<<8)|c(b)).toString(16).padStart(6,'0');

const AudioEngine = {
  ctx:null, master:null, playing:false, nodes:[],
  init(){ if(this.ctx) return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=0; this.master.connect(this.ctx.destination); },
  start(){ this.init(); if(!this.ctx) return; if(this.ctx.state==='suspended') this.ctx.resume(); if(this.playing) return; this.playing=true;
    const freqs=[110,164.81,220,146.83];
    freqs.forEach((f,i)=>{
      const osc=this.ctx.createOscillator(); osc.type=i%2===0?'sine':'triangle'; osc.frequency.value=f;
      const g=this.ctx.createGain(); g.gain.value=0.05+i*0.01;
      const lfo=this.ctx.createOscillator(); lfo.frequency.value=0.05+i*0.02;
      const lfoGain=this.ctx.createGain(); lfoGain.gain.value=0.02;
      lfo.connect(lfoGain); lfoGain.connect(g.gain); osc.connect(g); g.connect(this.master);
      osc.start(); lfo.start(); this.nodes.push(osc,lfo,g,lfoGain);
    });
    this.master.gain.linearRampToValueAtTime(0.11*SOUND.music, this.ctx.currentTime+2); },
  stop(){ if(!this.playing||!this.ctx) return; this.master.gain.linearRampToValueAtTime(0, this.ctx.currentTime+1);
    const nodesToClear=this.nodes; setTimeout(()=>{ nodesToClear.forEach(n=>{ try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){} }); },1100);
    this.nodes=[]; this.playing=false; },
  toggle(){ if(this.playing) this.stop(); else this.start(); }
};

  if(!g.club.office){ g.club.office={level:1, style:'modern', features:{}, news:[]}; }
  const o=g.club.office;
  if(!o.features) o.features={};
  OFFICE_FEATURES.forEach(f=>{ if(o.features[f.id]===undefined) o.features[f.id]=false; });
  o.level=Math.max(1, Math.min(5, o.level||1));
  return o;
}
function officeStyle(){ return OFFICE_STYLES.find(s=>s.id===officeBuild().style)||OFFICE_STYLES[0]; }
function officeLevel(){ return OFFICE_LEVELS[officeBuild().level-1]; }
function officeWeekly(){
  const o=officeBuild();
  let bonus = (o.level-1)*600 + (o.features.coffee?150:0);
  if(o.features.sofa) bonus += Math.round((200+state.game.club.reputation*8)*(o.features.sofa?0.02:0)+(state.game.club.sponsorDeal?state.game.club.sponsorDeal.weekly*0.02:0));
  return Math.round(bonus);
}
function officeEffects(){
  const o=officeBuild();
  let happiness=o.features.plants?0.5:0, reputation=o.features.wallart?1:0, board=o.features.trophies?1:0;
  return {happiness, reputation, board};
}

const PLAYER_FIRST = ['Ryan','Connor','Liam','Ezra','Malik','Ollie','Jamal','Finn','Aaron','Bilal','Callum','Nate','Diego','Kofi','Reuben','Tyler','Josh','Amari','Ivan','Sean'];
const PLAYER_LAST = ['Farrell','Okonjo','Micallef','Bassett','Duarte','Whitlock','Rahman','Kowalczyk','Lindqvist','Obuya','Santini','Marchetti','Vukovic','Haugen','Delaney','Costa','Adeboye','Sørensen','Bianchi','Kowal'];
const SQUAD_ROSTER_SPEC = [ ['GK',2], ['DEF',6], ['MID',6], ['FWD',4] ];
function positionWageMult(pos){ return pos==='GK'?0.85 : pos==='FWD'?1.15 : 1; }
function generateSquadPlayer(targetQuality, position){
  const pos = position || pick(POSITIONS);
  const variance = (Math.random()*24-12);
  const ovr = Math.max(8, Math.min(96, Math.round(targetQuality + variance)));
  const age = 17+Math.floor(Math.random()*19);
  const growthRoom = age<24 ? Math.round(Math.random()*18) : age<29 ? Math.round(Math.random()*6) : 0;
  const potential = Math.max(ovr, Math.min(99, ovr+growthRoom));
  const value = Math.round(Math.pow(ovr,2.15) * (age<23?1.35:age<29?1:age<33?0.6:0.3));
  const wage = Math.max(35, Math.round(ovr*2.2*positionWageMult(pos)));
  return { id:'player-'+Date.now()+'-'+Math.random().toString(36).slice(2,8), name: pick(PLAYER_FIRST)+' '+pick(PLAYER_LAST),
    position:pos, age, ovr, potential, value, wage, contractYears: 1+Math.floor(Math.random()*4), morale: 55+Math.floor(Math.random()*30), listed:false };
}
function generateSquad(targetQuality){
  const list=[];
  SQUAD_ROSTER_SPEC.forEach(([pos,count])=>{ for(let i=0;i<count;i++) list.push(generateSquadPlayer(targetQuality,pos)); });
  return list;
}
function generateTransferMarket(reputation){
  const targetQuality = 15+Math.round(reputation*0.6);
  const list=[]; for(let i=0;i<7;i++) list.push(generateSquadPlayer(targetQuality));
  if(reputation>=50) list.push(generateSquadPlayer(Math.min(90,targetQuality+30)));
  return list;
}
function recomputeSquadQuality(g){
  if(!g.squad || !g.squad.length) return;
  const avg = g.squad.reduce((s,p)=>s+p.ovr,0)/g.squad.length;
  g.club.playerQuality = Math.max(1, Math.min(100, Math.round(avg)));
}
function squadWageBill(g){ return (g.squad||[]).reduce((s,p)=>s+p.wage,0); }

function generateAcquisitionTargets(town){
  if(state.acquisitionTargets[town.id]) return state.acquisitionTargets[town.id];
  const list=[];
  for(let i=0;i<3;i++){
    const tier = 2+Math.floor(seededRandom(town.id+'acq'+i)*4);
    list.push({ id: town.id+'-acq-'+i, name: town.name.replace(' (Thurrock)','')+' '+pick(CLUB_SUFFIXES),
      tier, reputation: 15+Math.floor(Math.random()*35), playerQuality: 15+Math.floor(Math.random()*30),

      debt: 5000+Math.floor(Math.random()*60000), standTier: 1+Math.floor(Math.random()*2) });
  }
  state.acquisitionTargets[town.id]=list;
  return list;
}

  const town = TOWN_LOOKUP(state.selectedTownId);
  const mod = currentBackgroundMod();

  const rivals = ALL_TOWNS.filter(x=>x.id!==town.id).filter(x=>sameRegionAs(x,town)).map(x=>{
    const dist = Math.round(haversine(town.lat,town.lng,x.lat,x.lng));

      townId:x.id, distance: dist, tier: Math.max(0, Math.min(TIERS.length-1, preset.tier+Math.round((Math.random()*4)-2))),
      reputation: Math.max(5, Math.round(preset.reputation+(Math.random()*30-15))),
      playerQuality: Math.max(10, Math.round(preset.playerQuality+(Math.random()*20-10))),
      form:[], rivalryScore: Math.max(0, Math.round(70-dist*0.6)), matchesPlayed:0 };
  });

  const tier = preset.tier;
  let leagueClubs = rivals.filter(r=>r.tier===tier).sort((a,b)=>a.distance-b.distance);
  let genCount = 0;
  while(leagueClubs.length < 9){
    genCount++;
    leagueClubs.push({ id:'gen-'+tier+'-'+genCount, name: GENERIC_NAMES[(genCount+tier*3)%GENERIC_NAMES.length],
      townId:null, distance:9999, tier:tier, reputation: Math.max(5, Math.round(preset.reputation+(Math.random()*30-15))),

  }
  leagueClubs = leagueClubs.slice(0,9);

  const mid = Math.floor(cityGridSize/2); cityGrid[mid][mid]='stadium';

  startCash = Math.round(preset.cash*(consortium?1:(mod.cashMult||1)) - (site.cost||0));

  state.game = {
    week:1, season:1, seasonWeeks:20,
    club:{ ...c, cash:startCash, debt:preset.debt, reputation: Math.max(1, preset.reputation+(consortium?0:(mod.reputationBonus||0))),
      supporters:preset.supporters, playerQuality:preset.playerQuality, academyQuality:preset.academyQuality,
      staffQuality: Math.min(100, preset.staffQuality+(consortium?0:(mod.staffBonus||0))), tier:preset.tier,
      stands:{ north:preset.standTier, south:Math.max(0,preset.standTier-1), east:Math.max(0,preset.standTier-2), west:Math.max(0,preset.standTier-2) },
      standNames:{ north:'North Stand', south:'South Stand', east:'East Stand', west:'West Stand' },
      seatColor: SEAT_COLORS[0], roofBuilt:false, managerName:null, managerWage:0,
      sponsorDeal:null, stadiumSponsor:null,
      form:[], matchesPlayed:0, wins:0, draws:0, losses:0, points:0, gf:0, ga:0, ticketPrice:12, difficulty:preset.difficulty,
      sponsorBonus: consortium?0:(mod.sponsorBonus||0), cityDiscount: consortium?0:(mod.cityDiscount||0), councilRelations:50 },
    chairman: {...state.chairman},
    town: JSON.parse(JSON.stringify(town)), site: JSON.parse(JSON.stringify(site)),
    townStats:{ population: town.pop, happiness:60, traffic:20, pollution:10 },
    allRivals: rivals, league: leagueClubs, cityGrid, cityGridSize,
    financeLog:[], news:[{wk:0, text: consortium ? `The board welcomes a new investor at ${site.name.replace(' Ground','')}. The climb to full control begins.` : `${c.name} is founded in ${town.name} in ${c.founded}, based at the new ${site.name}. The chairman's journey begins.`}],

    fixtures: buildFixtures(leagueClubs), selectedCityTile:'road', pendingEvent:null,
    consortium: { active: consortium, influence: consortium?10:100 },

  };
  recomputeSquadQuality(state.game);
  const pending = giftCashPending();
  if(pending>0){ state.game.club.cash = (state.game.club.cash||0)+pending; dlcLoad().giftCash=0; dlcSave(); }

function TOWN_LOOKUP(id){ return ALL_TOWNS.find(x=>x.id===id); }
function sameRegionAs(x,town){
  const xLoc = ALL_LOCATIONS.find(l=>l.id===x.countyId);
  const tLoc = ALL_LOCATIONS.find(l=>l.id===town.countyId);
  return xLoc && tLoc && xLoc.region===tLoc.region;
}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function buildFixtures(leagueClubs){
  const opponents=leagueClubs.map(c=>c.id); const fixtures={}; let w=1;
  opponents.forEach(id=>{ fixtures[w]={oppId:id, home:true}; w++; });
  opponents.forEach(id=>{ fixtures[w]={oppId:id, home:false}; w++; });
  return fixtures;
}

/* ---------------- Simulation ---------------- */

function clubStrength(club){ return club.reputation*0.35+club.playerQuality*0.35+(club.staffQuality||25)*0.15+(club.academyQuality||20)*0.15; }
function simulateMatch(home, away, homeAdvantage){
  const sH=clubStrength(home)+(homeAdvantage||0), sA=clubStrength(away), total=sH+sA;
  return {gH:poissonish(1.1+(sH/total)*2.4), gA:poissonish(1.1+(sA/total)*2.4)};
}
function poissonish(lambda){ let L=Math.exp(-lambda),k=0,p=1; do{k++;p*=Math.random();}while(p>L&&k<10); return k-1; }
function findRival(oppId){ return state.game.allRivals.find(r=>r.id===oppId); }
function influenceOK(min){ const g=state.game; return !g.consortium.active || g.consortium.influence>=min; }
function addInfluence(amount){
  const g = state.game; if(!g.consortium.active) return;
  g.consortium.influence = Math.min(100, g.consortium.influence+amount);
  if(g.consortium.influence>=100){
    g.consortium.active=false;
    const msg = `The board votes unanimously to hand you full control of ${g.club.name}. You are now Chairman.`;
    g.news.unshift({wk:g.week, text:msg, event:true});
    autoSocialPost('Huge news — I\'m now fully in charge at this club. Time to go to work. 🤝', 15);
  }
}

function autoSocialPost(text, boost){
  const g = state.game;
  const followers = Math.max(50, Math.round(g.club.supporters*0.7 + g.club.reputation*6));
  const sentiment = (boost||0) >= 8 ? 'positive' : ((boost||0) < 0 ? 'negative' : 'neutral');
  const engagementRate = 0.03+ (g.club.reputation/1200);
  const likes = Math.max(3, Math.round(followers*engagementRate*(1+Math.random()*0.6)+(boost||0)));
  const numComments = Math.random()<0.5?1:(Math.random()<0.2?2:0);
  const pool = sentiment==='negative' ? FAN_REPLIES_NEG : FAN_REPLIES_POS;
  const comments=[]; for(let i=0;i<numComments;i++) comments.push(pick(pool));
  g.socialFeed.unshift({id:Date.now()+Math.random(), week:g.week, author:'@'+(g.club.shortName||slug(g.club.name).toUpperCase()), text, likes, comments, auto:true, sentiment});
  g.socialFeed = g.socialFeed.slice(0,80);
}

function tickWeek(){
  if(state.game.pendingEvent) return;
  const g = state.game;
  const fixture = g.fixtures[g.week];
  const news = [];

  if(fixture){
    const oppData = g.league.find(c=>c.id===fixture.oppId) || findRival(fixture.oppId);
    const rival = findRival(fixture.oppId);
    const isDerby = rival && rival.rivalryScore >= 55;
    const {gH,gA} = simulateMatch(fixture.home?g.club:oppData, fixture.home?oppData:g.club, fixture.home?4:0);
    const playerGoals = fixture.home?gH:gA, oppGoals = fixture.home?gA:gH;
    updateClubResult(g.club, playerGoals, oppGoals);
    updateClubResult(oppData, oppGoals, playerGoals);
    oppData.matchesPlayed=(oppData.matchesPlayed||0)+1;
    if(rival){ rival.matchesPlayed++; rival.rivalryScore=Math.min(100, rival.rivalryScore+4+(isDerby?4:0)); }

    const result = playerGoals>oppGoals?'win':playerGoals<oppGoals?'loss':'draw';
    const attendance = computeAttendance(isDerby);
    const gate = attendance*g.club.ticketPrice;
    let resultLine;
    if(fixture.home){ g.club.cash += gate; resultLine = `${isDerby?'DERBY DAY! ':''}${g.club.name} ${playerGoals}-${oppGoals} ${oppData.name}. Attendance ${attendance.toLocaleString()}, gate receipts £${Math.round(gate).toLocaleString()}.`; }
    else { resultLine = `${isDerby?'DERBY DAY! ':''}${oppData.name} ${oppGoals}-${playerGoals} ${g.club.name} (away).`; }
    news.push(resultLine);
    if(fixture.home && attendance>g.records.recordAttendance){ g.records.recordAttendance = attendance; }
    if(result==='win'){
      const margin = playerGoals-oppGoals;
      const currentMargin = g.records.biggestWin ? g.records.biggestWin.margin : -1;
      if(margin>currentMargin) g.records.biggestWin = { margin, text:`${fixture.home?g.club.name+' '+playerGoals+'-'+oppGoals+' '+oppData.name:oppData.name+' '+oppGoals+'-'+playerGoals+' '+g.club.name}`, season:g.season, week:g.week };
    }
    autoSocialPost(result==='win' ? `FULL TIME: ${fixture.home?g.club.name+' '+playerGoals+'-'+oppGoals+' '+oppData.name:oppData.name+' '+oppGoals+'-'+playerGoals+' '+g.club.name}. Get in!! 🎉` :
      result==='loss' ? `FULL TIME: tough result today. Onwards to the next one.` : `FULL TIME: a point on the board. Keep going.`, result==='win'?20:(result==='loss'?-4:2));

    if(result==='win'){ g.club.reputation=Math.min(100,g.club.reputation+(isDerby?2.5:1)); addInfluence(6); }
    if(result==='loss') g.club.reputation=Math.max(1,g.club.reputation-(isDerby?1.5:0.6));
    if(result==='draw') addInfluence(2);
    g.club.supporters=Math.max(10,Math.round(g.club.supporters*(result==='win'?1.01:result==='loss'?0.995:1.0)));
  } else { news.push('Quiet week — training continues, the club and town tick over.'); }

  const fin = weeklyFinance();
  g.club.cash += fin.net;
  g.financeLog.push({week:g.week, ...fin});
  if(g.financeLog.length>16) g.financeLog.shift();

  tickTown();
  checkCityExpansion();
  g.club.reputation = Math.max(1, Math.min(100, g.club.reputation + officeEffects().reputation));

  g.allRivals.forEach(r=>{
    if(Math.random()<0.15) r.reputation=Math.min(100,r.reputation+Math.round(Math.random()*3));
    if(Math.random()<0.1) r.playerQuality=Math.min(100,r.playerQuality+Math.round(Math.random()*3));
  });

  g.news.unshift(...news.map(n=>({wk:g.week, text:n})));
  g.news = g.news.slice(0,50);

  g.week++;
  if(g.week > g.seasonWeeks) endSeason();

  maybeTriggerEvent();
  save(); render();
}

function maybeTriggerEvent(){
  const g = state.game; if(g.pendingEvent) return;
  const riskFactor = 0.9+(g.chairman.riskTolerance/100)*0.3;
  if(Math.random() > 0.24*riskFactor) return;
  const ev = EVENTS[Math.floor(Math.random()*EVENTS.length)];
  if(ev.auto){ ev.apply(g); g.news.unshift({wk:g.week, text:`${ev.title}: ${ev.text(g)}`, event:true}); }
  else { g.pendingEvent = ev.id; }
}
function resolveEvent(choiceIdx){
  const g = state.game; const ev = EVENTS.find(e=>e.id===g.pendingEvent); if(!ev) return;
  const resultText = ev.choices[choiceIdx].apply(g);
  g.news.unshift({wk:g.week, text:`${ev.title}: ${resultText}`, event:true});
  g.pendingEvent = null; addInfluence(4); save(); render();
}

function updateClubResult(c, gf, ga){
  c.matchesPlayed=(c.matchesPlayed||0)+1; c.gf=(c.gf||0)+gf; c.ga=(c.ga||0)+ga;
  if(gf>ga){ c.wins=(c.wins||0)+1; c.points=(c.points||0)+3; c.form=[...(c.form||[]),'W'].slice(-5); }
  else if(gf<ga){ c.losses=(c.losses||0)+1; c.form=[...(c.form||[]),'L'].slice(-5); }
  else { c.draws=(c.draws||0)+1; c.points=(c.points||0)+1; c.form=[...(c.form||[]),'D'].slice(-5); }
}
function computeAttendance(isDerby){
  const g = state.game, capacity = totalCapacity();
  const demand = g.club.supporters*(0.55+(g.club.reputation/200))*(isDerby?1.5:1)*(16/(g.club.ticketPrice+4));
  return Math.max(50, Math.min(capacity, Math.round(demand)));
}
function totalCapacity(){
  const s = state.game.club.stands;
  return STAND_TIERS[s.north].cap+STAND_TIERS[s.south].cap+STAND_TIERS[s.east].cap+STAND_TIERS[s.west].cap;
}
function weeklyFinance(){
  const g = state.game;
  const difficulty = g.club.difficulty || 1.0;
  const officeBonus = officeWeekly();
  const sponsorship = Math.round((200+g.club.reputation*8)*(1+(g.club.sponsorBonus||0)+(officeBuild().features.sofa?0.02:0))) + (g.club.sponsorDeal?g.club.sponsorDeal.weekly:0) + (g.club.stadiumSponsor?g.club.stadiumSponsor.weekly:0) + officeBonus;
  const merch = Math.round(g.club.supporters*0.4);
  const propertyIncome = cityIncome();
  const playerWages = g.squad && g.squad.length ? squadWageBill(g) : Math.round(g.club.playerQuality*40);
  const wages = Math.round((playerWages+(g.club.staffQuality*15)+(g.club.managerWage||0)) * difficulty);
  const maintenance = Math.round(totalCapacity()*0.35*difficulty);
  const debtInterest = Math.round(g.club.debt*0.002*difficulty);
  const income = sponsorship+merch+propertyIncome, expenses = wages+maintenance+debtInterest;
  return {income:Math.round(income), expenses:Math.round(expenses), net:Math.round(income-expenses), sponsorship, merch, propertyIncome, wages, maintenance, debtInterest, officeBonus};
}
function cityIncome(){
  const g = state.game; let total=0;
  for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){ const def=CITY_TILE_TYPES[g.cityGrid[y][x]]; if(def&&def.income) total+=def.income; }
  return total;
}
function tickTown(){
  const g = state.game; let pop=0, traffic=0, reputationBoost=0;
  for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){ const def=CITY_TILE_TYPES[g.cityGrid[y][x]]; if(def){ pop+=(def.popEffect||0); traffic+=(def.trafficEffect||0); reputationBoost+=(def.reputation||0); } }
  const oef = officeEffects();
  g.townStats.population += pop*3+Math.round(g.club.reputation*0.3);
  g.townStats.traffic = Math.max(0,Math.min(100,g.townStats.traffic+traffic));
  g.townStats.happiness = Math.max(0,Math.min(100,g.townStats.happiness+(reputationBoost*0.5)+oef.happiness-(g.townStats.traffic>70?1:0)));
  if(g.townStats.traffic>80 && Math.random()<0.2){
    g.news.unshift({wk:g.week, text:`Local residents raise concerns about matchday traffic congestion near ${g.town.name} — the council is watching closely.`});
    g.club.reputation = Math.max(1, g.club.reputation-0.5);
    g.club.councilRelations = Math.max(0, g.club.councilRelations-2);
  }
  if(g.townStats.traffic<30) g.club.councilRelations = Math.min(100, g.club.councilRelations+0.15);
  if(g.townStats.happiness>70) g.club.councilRelations = Math.min(100, g.club.councilRelations+0.1);
}
function desiredGridSize(cap){ let s=7; GRID_MILESTONES.forEach(m=>{ if(cap>=m.cap) s=m.size; }); return s; }
function checkCityExpansion(){
  const g = state.game; const desired = desiredGridSize(totalCapacity());
  if(desired<=g.cityGridSize) return;
  const oldSize=g.cityGridSize, oldGrid=g.cityGrid;
  const newGrid=[]; for(let y=0;y<desired;y++){ const row=[]; for(let x=0;x<desired;x++) row.push('empty'); newGrid.push(row); }
  const offset = Math.floor((desired-oldSize)/2);
  for(let y=0;y<oldSize;y++) for(let x=0;x<oldSize;x++) newGrid[y+offset][x+offset]=oldGrid[y][x];
  g.cityGrid=newGrid; g.cityGridSize=desired;
  g.news.unshift({wk:g.week, text:`The town boundary expands as ${g.club.name}'s stadium grows — new land opens up around the ground.`, event:true});
}
function endSeason(){
  const g = state.game;
  const table = [{id:'player', name:g.club.name+' (You)', points:g.club.points, gf:g.club.gf, ga:g.club.ga},
    ...g.league.map(c=>({id:c.id,name:c.name,points:c.points||0,gf:c.gf||0,ga:c.ga||0}))]
    .sort((a,b)=> b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga));
  const playerPos = table.findIndex(r=>r.id==='player')+1;
  let msg = `Season ${g.season} ends. ${g.club.name} finish ${ordinal(playerPos)} in ${TIERS[g.club.tier]} with ${g.club.points} points.`;
  let outcome = 'stayed up';
  if(playerPos<=2 && g.club.tier<TIERS.length-1){ g.club.tier++; msg+=` Promoted to ${TIERS[g.club.tier]}!`; g.club.reputation=Math.min(100,g.club.reputation+8); outcome='promoted'; }
  else if(playerPos>=8 && g.club.tier>0){ g.club.tier--; msg+=` Relegated to ${TIERS[g.club.tier]}.`; g.club.reputation=Math.max(1,g.club.reputation-6); outcome='relegated'; }
  g.history.push({ season:g.season, tier:TIERS[g.club.tier], position:playerPos,
    points:g.club.points, wins:g.club.wins, draws:g.club.draws, losses:g.club.losses, outcome, managerName:g.club.managerName||null });
  g.news.unshift({wk:g.week, text:msg});
  autoSocialPost(msg, 10);
  if(g.club.academyQuality>40 && Math.random()<0.6) g.academyProspects.push(...generateProspects(1));

  g.season++; g.week=1;
  g.club.matchesPlayed=0; g.club.wins=0; g.club.draws=0; g.club.losses=0; g.club.points=0; g.club.gf=0; g.club.ga=0; g.club.form=[];
  let leagueClubs = g.allRivals.filter(r=>r.tier===g.club.tier);
  let genCount=0;
  while(leagueClubs.length<9){
    genCount++;
    leagueClubs.push({id:'gen-'+g.club.tier+'-'+g.season+'-'+genCount, name: GENERIC_NAMES[(genCount+g.club.tier*3)%GENERIC_NAMES.length],
      townId:null, distance:9999, tier:g.club.tier, reputation: Math.max(5, Math.round(g.club.reputation+(Math.random()*30-15))),
      playerQuality: Math.max(10, Math.round(g.club.playerQuality+(Math.random()*20-10))), form:[], rivalryScore:5, matchesPlayed:0});
  }
  g.league = leagueClubs.slice(0,9).map(c=>({...c, points:0, gf:0, ga:0, wins:0, draws:0, losses:0, matchesPlayed:0}));
  g.fixtures = buildFixtures(g.league);
}
function ordinal(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }

/* ---------------- Board advisor ---------------- */
function generateAdvice(){
  const g = state.game; const tips=[];
  if(g.club.cash < 2000) tips.push({icon:'💰', text:'Cash reserves are low — consider raising ticket prices, signing a sponsor deal, or slowing spending.'});
  if(g.club.supporters*0.6 > totalCapacity()) tips.push({icon:'🏟️', text:'Demand is outstripping capacity on big matchdays — a stand upgrade could unlock real extra income.'});
  if(g.club.academyQuality < 30) tips.push({icon:'🌱', text:'The academy is underdeveloped — investment here pays off over several seasons of homegrown talent.'});
  if(!g.club.roofBuilt && g.week%4===0) tips.push({icon:'🌧️', text:'Weather postponements hurt income without a roof — worth budgeting for one.'});
  if(g.club.ticketPrice > 30 && g.townStats.happiness < 55) tips.push({icon:'🎟️', text:'High ticket prices may be denting fan happiness — a small reduction could help matchday mood.'});
  if(!g.club.sponsorDeal) tips.push({icon:'🤝', text:'No shirt sponsor signed yet — the Finances tab has offers on the table.'});
  if(!g.club.managerName) tips.push({icon:'👔', text:'You haven\'t hired a dedicated manager yet — the Staff tab has candidates on the market.'});
  if(g.consortium.active) tips.push({icon:'🗳️', text:`Boardroom influence is at ${Math.round(g.consortium.influence)}/100 — keep winning matches and resolving events well to earn full control.`});
  if(g.academyProspects.length>0) tips.push({icon:'⭐', text:`${g.academyProspects.length} academy prospect(s) are ready to be assessed for first-team promotion.`});
  if(g.club.councilRelations<40) tips.push({icon:'🏛️', text:'Council relations are low — your biggest stadium and city developments will be blocked until this improves.'});
  if(tips.length===0) tips.push({icon:'✅', text:'Things are in good shape. Keep an eye on rivals and consider your next big investment.'});
  return tips.slice(0,4);
}

function migrateState(){
  if(!state || !state.game) return;
  const g = state.game;
  if(!g.squad || !g.squad.length){ g.squad = generateSquad(g.club.playerQuality||25); recomputeSquadQuality(g); }

function el(html){
  const t=(html||'').trim();
  const d=document.createElement('div');
  if(/^<(tr|td|th)(\s|>)/i.test(t)){
    const tbl=document.createElement('table'); tbl.innerHTML='<tbody>'+t+'</tbody>';
    return (tbl.querySelector('tbody').firstElementChild);
  }
  if(/^<(thead|tbody|tfoot)(\s|>)/i.test(t)){
    const tbl=document.createElement('table'); tbl.innerHTML=t;
    return tbl.firstElementChild;
  }
  d.innerHTML=t; return d.firstElementChild;
}
function $(sel,root){ return (root||document).querySelector(sel); }

function svgIcon(path,viewBox){ return `<svg viewBox="${viewBox||'0 0 24 24'}" aria-hidden="true"><path d="${path}"/></svg>`; }

/* Build a styled dropdown <select> of options. opts: [{value,label,color?}].
   Returns HTML string; change events are routed through the global registry via bindDropdownMenus(). */
window.__drops = window.__drops || {};
let __dropSeq = 0;
function dropdownMenu(id, opts, current, onChange, placeholder){
  const cb = '__d'+(++__dropSeq);
  window.__drops[cb] = onChange;
  return `<select id="${id}" class="dropdown-menu" data-cb="${cb}" aria-label="${placeholder||''}">${opts.map(o=>
    `<option value="${o.value}" ${String(o.value)===String(current)?'selected':''}>${o.color?'■ ':''}${o.label}</option>`).join('')}</select>`;
}
function bindDropdownMenus(){
  if(window.__dropsBound) return; window.__dropsBound = true;
  document.addEventListener('change', (e)=>{
    const t = e.target;
    if(t && t.matches && t.matches('select.dropdown-menu')){
      const cb = t.getAttribute('data-cb'); if(cb && window.__drops[cb]) window.__drops[cb](t.value, t);
    }
  }, true);
}

      $('#f-primary')?.addEventListener('input', e=>{c.primary=e.target.value; render();});
      $('#f-secondary')?.addEventListener('input', e=>{c.secondary=e.target.value; render();});
      $('#f-awayprimary')?.addEventListener('input', e=>{c.awayPrimary=e.target.value; render();});
      $('#f-awaysecondary')?.addEventListener('input', e=>{c.awaySecondary=e.target.value; render();});

function kitSvg(c, home){
  const primary = home?c.primary:c.awayPrimary, secondary = home?c.secondary:c.awaySecondary;
  let pattern='';
  if(c.kitPattern==='hoops') pattern=`<div class="pattern" style="background:repeating-linear-gradient(0deg,${secondary} 0 10px,transparent 10px 20px)"></div>`;
  else if(c.kitPattern==='stripes') pattern=`<div class="pattern" style="background:repeating-linear-gradient(90deg,${secondary} 0 8px,transparent 8px 16px)"></div>`;
  else if(c.kitPattern==='sash') pattern=`<div class="pattern" style="background:linear-gradient(135deg,transparent 40%,${secondary} 40% 55%,transparent 55%)"></div>`;
  else if(c.kitPattern==='halves') pattern=`<div class="pattern" style="background:linear-gradient(90deg,${secondary} 0 50%,transparent 50%)"></div>`;
  else if(c.kitPattern==='quarters') pattern=`<div class="pattern" style="background:conic-gradient(from 90deg at 50% 50%,${secondary} 0 25%,transparent 25% 50%,${secondary} 50% 75%,transparent 75%)"></div>`;
  else if(c.kitPattern==='pinstripe') pattern=`<div class="pattern" style="background:repeating-linear-gradient(90deg,${secondary} 0 2.5px,transparent 2.5px 8px)"></div>`;
  else if(c.kitPattern==='gradient') pattern=`<div class="pattern" style="background:linear-gradient(180deg,${secondary} 0%,transparent 65%)"></div>`;
  return `<div class="body" style="background:${primary}"></div>${pattern}`;
}
function badgeSvg(c){
  const shapePath = { shield:'M32 4 L58 14 V34 C58 50 46 60 32 62 C18 60 6 50 6 34 V14 Z', circle:'M32 4a28 28 0 100 56 28 28 0 000-56z',
    hexagon:'M32 3 L58 18 V46 L32 61 L6 46 V18 Z', diamond:'M32 3 L61 32 L32 61 L3 32 Z',
    crest:'M32 4 C22 8 16 12 10 16 V34 C10 52 22 61 32 62 C42 61 54 52 54 34 V16 C48 12 42 8 32 4 Z',

    square:'M14 8 L50 8 L56 14 L56 50 L50 56 L14 56 L8 50 L8 14 Z' }[c.badgeShape];
  const iconPath = BADGE_ICONS[c.badgeIcon] || BADGE_ICONS.star;

      <div class="mh-stat"><div class="lbl">Capacity</div><div class="v">${totalCapacity().toLocaleString()}</div></div>
    </div>
    <button class="continue-btn" id="advance-btn" aria-label="Advance to next week">${g.pendingEvent?'<span class="dot"></span>':''}Continue ▸</button>
  </header>`);
  layout.appendChild(masthead);

  const bodyRow = el(`<div class="layout"></div>`);
  const rail = el(`<nav class="rail" aria-label="Club sections"></nav>`);
  NAV_ITEMS.forEach(([key,label])=>{
    const item = el(`<div class="rail-item ${state.dashTab===key?'active':''}">${svgIcon(NAV_ICONS[key])}<span>${label}</span></div>`);
    bindClickable(item, ()=>{ state.dashTab=key; render(); }, label+' tab');

    rail.appendChild(item);
  });

  if(g.pendingEvent) layout.appendChild(renderEventModal());

  setTimeout(()=>{ $('#advance-btn')?.addEventListener('click', tickWeek); bindTabEvents(state.dashTab); bindEventModal(); },0);
  return layout;
}

function bindSquadEvents(){
  $('#reroll-transfers')?.addEventListener('click', ()=>{

    g.club.cash-=1200; g.transferMarket = generateTransferMarket(g.club.reputation);
    save(); render();
  });
  $all('[data-sign]').forEach(btn=>btn.addEventListener('click', ()=>{
    const g=state.game; const p = (g.transferMarket||[]).find(x=>x.id===btn.getAttribute('data-sign')); if(!p) return;
    if(g.club.cash<p.value){ alert('Not enough cash.'); return; }
    g.club.cash -= p.value; g.squad.push(p);
    g.transferMarket = g.transferMarket.filter(x=>x.id!==p.id);
    recomputeSquadQuality(g);
    if(!g.records.transferIn || p.value>g.records.transferIn.value) g.records.transferIn = {name:p.name, value:p.value, season:g.season};
    g.news.unshift({wk:g.week, text:`${g.club.name} sign ${p.name} (${p.position}, OVR ${p.ovr}) for £${p.value.toLocaleString()}.`});
    save(); render();
  }));
  $all('[data-sell]').forEach(btn=>btn.addEventListener('click', ()=>{
    const g=state.game; if(g.squad.length<=11){ alert('Squad is at the minimum size — sign a replacement first.'); return; }
    const p = g.squad.find(x=>x.id===btn.getAttribute('data-sell')); if(!p) return;
    if(!confirm(`Sell ${p.name} for £${Math.round(p.value*0.85).toLocaleString()}?`)) return;

    g.squad = g.squad.filter(x=>x.id!==p.id); g.club.cash += fee;

    if(!g.records.transferOut || fee>g.records.transferOut.value) g.records.transferOut = {name:p.name, value:fee, season:g.season};
    g.news.unshift({wk:g.week, text:`${g.club.name} sell ${p.name} for £${fee.toLocaleString()}.`});
    save(); render();
  }));
}

function drawStadium(canvas){

  ctx.moveTo(0,0); ctx.lineTo(w*0.34,0); ctx.lineTo(w*0.12,h*0.62); ctx.lineTo(0,h*0.4); ctx.closePath(); ctx.fill();
  ctx.restore();

    grad.addColorStop(0, shadeHex(tierIdx>=5?'#E8C158':(tierIdx>=4?'#3DA5D9':seatBase), 18));
    grad.addColorStop(1, shadeHex(tierIdx>=5?'#E8C158':(tierIdx>=4?'#3DA5D9':seatBase), -22));
    ctx.fillStyle=grad;

    if(sd.dy!==undefined){ rectW=pitchW+30; rectX=cx-rectW/2; rectY=sd.dy<0?cy-pitchH/2-height-6:cy+pitchH/2+6; rectH=height; ctx.fillRect(rectX,rectY,rectW,rectH); }
    else { rectH=pitchH+30; rectY=cy-rectH/2; rectX=sd.dx<0?cx-pitchW/2-height-6:cx+pitchW/2+6; rectW=height; ctx.fillRect(rectX,rectY,rectW,rectH); }
    const seatRows=ctx.createLinearGradient(sd.dy?0:rectX, sd.dy?rectY:0, sd.dy?0:rectX+rectW, sd.dy?rectY+rectH:0);
    seatRows.addColorStop(0,'rgba(255,255,255,.0)'); seatRows.addColorStop(.5,'rgba(255,255,255,.12)'); seatRows.addColorStop(1,'rgba(0,0,0,.0)');

    else { for(let i=0;i<rectH;i+=7){ ctx.beginPath(); ctx.moveTo(rectX,rectY+i); ctx.lineTo(rectX+rectW,rectY+i); ctx.stroke(); } }
    if(g.club.roofBuilt){ const rc=shadeHex(g.club.roofColor||'#274060',10); const rg=ctx.createLinearGradient(sd.dy?0:cx-sd.dx*height, sd.dy?rectY:0, sd.dy?0:cx-sd.dx*height, sd.dy?rectY+rectH:0);
      rg.addColorStop(0,shadeHex(rc,30)); rg.addColorStop(1,shadeHex(rc,-35)); ctx.fillStyle=rg;
      if(sd.dy!==undefined) ctx.fillRect(rectX,sd.dy<0?rectY-7:rectY+rectH+2,rectW,9); else ctx.fillRect(sd.dx<0?rectX-9:rectX+rectW+2,rectY,9,rectH);

function isoProject(gx,gy,cellPx,originX,originY){ return [originX+(gx-gy)*cellPx/2, originY+(gx+gy)*cellPx/4]; }

/* ---- 3D city rendering (regional architecture) ---- */
function shade2(hex,amt){
  hex=(hex||'#888888').replace('#',''); if(hex.length!==6) return hex;
  const n=parseInt(hex,16), r=(n>>16)+amt, g=(n>>8&255)+amt, b=(n&255)+amt;
  const c=(x)=>Math.max(0,Math.min(255,x)).toString(16).padStart(2,'0');
  return '#'+c(r)+c(g)+c(b);
}
function drawRoofline(ctx, N, E, S, W, style, roofColor){
  if(style==='flat'){
    ctx.fillStyle=roofColor; ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.lineTo(W.x,W.y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.55)'; ctx.lineWidth=1; ctx.stroke();
    return;
  }
  if(style==='gabled'){
    const gx=(E.x+W.x)/2, gy=Math.min(E.y,W.y)-(E.y-W.y)*0.0, peak=(N.y+S.y)/2-(N.y-W.y)*0.8;
    ctx.fillStyle=roofColor;
    ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(gx,peak); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.closePath(); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.10)'; ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(gx,peak); ctx.lineTo(N.x,N.y); ctx.lineTo(S.x,S.y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
    return;
  }
  if(style==='slate'){
    ctx.fillStyle=roofColor;
    ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.lineTo(W.x,W.y); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(S.x,S.y); ctx.lineTo((E.x+W.x)/2, (E.y+W.y)/2- (E.y-W.y)); ctx.closePath();
    ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
    return;
  }
  // pitched by default
  const midX=(E.x+W.x)/2, midY=S.y, peak=Math.min(N.y,S.y)- (W.y-N.y);
  ctx.fillStyle=roofColor;
  ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(E.x,E.y); ctx.lineTo(midX,peak); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.10)'; ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(N.x,N.y); ctx.lineTo(midX,peak); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1; ctx.stroke();
}
function drawCity3D(ctx, sx, sy, w, h, type, st, seed){
  const def = CITY_TILE_TYPES[type]||CITY_TILE_TYPES.empty;
  if(type==='stadium'){ drawIsoTile(ctx,sx,sy,w,h,'#E8C158'); ctx.fillStyle='#3A2E16'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center'; ctx.fillText('STADIUM',sx,sy+3); return; }
  if(type==='empty'){ drawIsoTile(ctx,sx,sy,w,h,def.color); return; }
  const rand=(a,b)=> a+((seed*7+Math.abs(seed))%97)/97*(b-a);
  const drawFace=(p1,p2,p3,p4,c)=>{ ctx.fillStyle=c; ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y); ctx.lineTo(p4.x,p4.y); ctx.closePath(); ctx.fill(); };
  const N={x:sx,y:sy-h/2}, E={x:sx+w/2,y:sy}, S={x:sx,y:sy+h/2}, W={x:sx-w/2,y:sy};
  if(type==='road'){
    ctx.fillStyle=shade2(st.accent,26);
    ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.lineTo(W.x,W.y); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=Math.max(1,w*0.06); ctx.beginPath(); ctx.moveTo(W.x, W.y-(S.y-W.y)*0.5); ctx.lineTo(S.x, S.y-(E.y-S.y)*0.0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W.x,W.y); ctx.lineTo(S.x,S.y); ctx.stroke();
    return;
  }
  if(type==='park'){
    ctx.fillStyle=shade2(st.accent,34);
    ctx.beginPath(); ctx.moveTo(N.x,N.y); ctx.lineTo(E.x,E.y); ctx.lineTo(S.x,S.y); ctx.lineTo(W.x,W.y); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#3E6B3A'; ctx.beginPath(); ctx.ellipse(S.x+w*0.10,S.y-h*0.08,w*0.20,h*0.30,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W.x-w*0.02,S.y+h*0.08,w*0.17,h*0.26,0,0,Math.PI*2); ctx.fill();
    return;
  }
  const bw=w*rand(0.62,0.8), bh=h*0.5;
  const H = type==='hotel'||type==='apartments'?bh*rand(2.2,3.2):type==='office'||type==='restaurant'||type==='shop'?bh*rand(1.7,2.5):bh*rand(1.1,1.7);
  const Nt={x:sx,y:sy-h/2-H}, Et={x:sx+w/2,y:sy-H}, St={x:sx,y:sy+h/2-H}, Wt={x:sx-w/2,y:sy-H};
  // front-left and front-right walls
  drawFace(W, S, St, Wt, shade2(st.wall,-8));
  drawFace(E, S, St, Et, shade2(st.wall,-34));
  // windows on both front walls
  const winC = (type==='hotel'||type==='office') ? 'rgba(120,200,210,.6)' : st.windows;
  ctx.fillStyle=winC;
  for(let r=0;r<2;r++) for(let c2=0;c2<2;c2++){
    const wy = S.y - H + ((H)/(2))* (r+0.5) + bh*0.35;
    ctx.fillRect(E.x+((bw*0.5)/(2+1))*(c2+0.5)-bh*0.5-1.5, wy-2, 3, bh*0.34);
    ctx.fillRect(W.x-((bw*0.5)/(2+1))*(c2+0.5)+bh*0.5-1.5, wy-2, 3, bh*0.34);
  }
  drawRoofline(ctx, Nt, Et, St, Wt, st.roofStyle, st.roof);
}
function drawCity(canvas,cellPx){
  const g = state.game, ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const st = areaStyleFor();
  const originX=canvas.width/2, originY=Math.max(40,canvas.height*0.16), tileW=cellPx, tileH=cellPx/2;
  ctx.fillStyle='#0B101A'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='rgba(130,160,200,.10)';
  for(let i=0;i<140;i++){ ctx.save(); ctx.globalAlpha=0.3+Math.random()*0.6; ctx.fillRect(((i*173.79)%canvas.width),(i*97.31)%(canvas.height*0.55),1,1); ctx.restore(); }
  ctx.fillStyle='rgba(90,130,200,0.14)'; ctx.fillRect(0,0,canvas.width,46);
  const items=[];
  for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){
    const [sx,sy]=isoProject(x,y,cellPx,originX,originY);
    items.push({x,y,sx,sy,type:g.cityGrid[y][x]});
  }
  items.sort((a,b)=> (a.y-b.y) || (a.x-b.x));
  items.forEach(it=> drawCity3D(ctx, it.sx, it.sy, tileW, tileH, it.type, st, it.x*31+it.y*17+(g.week||0)*3));
}
function drawIsoTile(ctx,cx,cy,w,h,color){
  ctx.beginPath(); ctx.moveTo(cx,cy-h/2); ctx.lineTo(cx+w/2,cy); ctx.lineTo(cx,cy+h/2); ctx.lineTo(cx-w/2,cy); ctx.closePath();
  ctx.fillStyle=color; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=1; ctx.stroke();
}
function bindCityEvents(){
  $all('[data-tile]').forEach(btn=>btn.addEventListener('click', ()=>{ state.game.selectedCityTile=btn.getAttribute('data-tile'); render(); }));
  const canvas = $('[data-city-canvas]', document) || $('canvas', $('.content')); if(!canvas) return;
  function placeAt(x,y){
    const g = state.game; if(g.cityGrid[y][x]==='stadium') return;
    const tileKey=g.selectedCityTile, def=CITY_TILE_TYPES[tileKey];
    if(tileKey!=='empty'){
      if(def.councilMin && g.club.councilRelations<def.councilMin){ alert(`The council won't approve this development yet — needs ${def.councilMin}+ Council Relations (see the History tab).`); return; }
      const cost = Math.round(def.cost*(1-(g.club.cityDiscount||0))); if(g.club.cash<cost){ alert('Not enough cash for this development.'); return; } g.club.cash -= cost;
    }
    g.cityGrid[y][x]=tileKey; save(); render();
  }
  canvas.addEventListener('click',(e)=>{
    const g = state.game, rect = canvas.getBoundingClientRect();
    const scaleX=canvas.width/rect.width, scaleY=canvas.height/rect.height;
    const mx=(e.clientX-rect.left)*scaleX, my=(e.clientY-rect.top)*scaleY;
    const cellPx=canvas.width/g.cityGridSize, originX=canvas.width/2, originY=20;
    let best=null, bestDist=Infinity;
    for(let y=0;y<g.cityGridSize;y++) for(let x=0;x<g.cityGridSize;x++){ const [sx,sy]=isoProject(x,y,cellPx,originX,originY); const d=Math.hypot(sx-mx,sy-my); if(d<bestDist){bestDist=d; best={x,y};} }
    if(best) placeAt(best.x,best.y);
  });
  canvas.addEventListener('keydown',(e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); const g=state.game; const mid=Math.floor(g.cityGridSize/2); placeAt(Math.min(g.cityGridSize-1,mid+1),mid); } });
}

function bindRivalsEvents(){

    const income = Math.round(150+(g.club.reputation+r.reputation)*2);
    g.club.cash += income; g.club.reputation = Math.min(100, g.club.reputation+0.3);

    save(); render();
  }));
  $all('[data-enquire]').forEach(btn=>btn.addEventListener('click', ()=>{
    const g=state.game; const r = findRival(btn.getAttribute('data-enquire')); if(!r) return;
    const cost = 5000+Math.round(Math.random()*10000);
    if(g.club.cash<cost){ alert('Not enough cash for scouting and a fee.'); return; }
    g.club.cash -= cost;
    const chance = 0.35 + g.club.academyQuality/300;
    if(Math.random()<chance){ g.club.playerQuality = Math.min(100, g.club.playerQuality+2); g.news.unshift({wk:g.week, text:`A transfer enquiry to ${r.name} succeeds — a new player joins the squad.`}); }
    else { g.news.unshift({wk:g.week, text:`A transfer enquiry to ${r.name} falls through, but the scouting fee is spent regardless.`}); }

function bindSocialEvents(){
  $('#social-post-btn')?.addEventListener('click', ()=>{
    const g = state.game;
    const catKey = $('#social-cat').value; const customText = $('#social-text').value;
    const cat = SOCIAL_CATEGORIES[catKey];
    const text = customText && customText.trim() ? customText.trim() : pick(cat.templates).replace('{club}', g.club.name).replace('{nickname}', g.club.nickname||g.club.name);
    const followers = Math.max(50, Math.round(g.club.supporters*0.7 + g.club.reputation*6));
    const engagementRate = 0.03+(g.club.reputation/1200);
    const likes = Math.max(3, Math.round(followers*engagementRate*(1+Math.random()*0.6)));
    const numComments = Math.random()<0.6?1:(Math.random()<0.3?2:0);
    const comments=[]; for(let i=0;i<numComments;i++) comments.push(pick(FAN_REPLIES_POS));
    cat.effect(g);
    if(likes>40) addInfluence(3);
    g.socialFeed.unshift({id:Date.now()+Math.random(), week:g.week, author:'@'+(g.club.shortName||slug(g.club.name).toUpperCase()), text, likes, comments, category:catKey, sentiment:'neutral'});
    g.socialFeed = g.socialFeed.slice(0,80);
    save(); render();
  });

  {id:'dlc-life', name:'A Life Behind Football', tag:'LIFE STORY DLC', icon:'🎭', code:'CC-LIFE-2026',
   desc:'Unlocks the three life stories: Local Hero, Football Family and Wonderkid to Chairman.',

function dlcOwned(id){ return Array.isArray(dlcLoad().dlc) && dlcLoad().dlc.indexOf(id)!==-1; }
function storyUnlocked(storyId){ const p = DLC_PACKS.find(x=>x.unlocks.includes(storyId)); return p ? dlcOwned(p.id) : true; }
function modeUnlocked(modeKey){ const p = DLC_PACKS.find(x=>Array.isArray(x.modes) && x.modes.includes(modeKey)); return p ? dlcOwned(p.id) : true; }
function normalizeCode(s){ return (s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function dlcPackForCode(code){ return DLC_PACKS.find(p=>normalizeCode(p.code)===code) || null; }
function giftCashPending(){ return dlcLoad().giftCash||0; }
const DLC_STORAGE_KEY = 'chairman-city-dlc-v1';
let dlcStoreCache = null;
function dlcLoad(){
  if(dlcStoreCache===null){
    try{ dlcStoreCache = JSON.parse(localStorage.getItem(DLC_STORAGE_KEY))||{}; }
    catch(e){ dlcStoreCache = {}; }
    if(!Array.isArray(dlcStoreCache.dlc)) dlcStoreCache.dlc=[];
    if(!Array.isArray(dlcStoreCache.redeemedCodes)) dlcStoreCache.redeemedCodes=[];
    if(!dlcStoreCache.giftCash) dlcStoreCache.giftCash=0;
  }
  return dlcStoreCache;
}
function dlcSave(){ try{ localStorage.setItem(DLC_STORAGE_KEY, JSON.stringify(dlcLoad())); }catch(e){ console.warn('DLC save failed', e); } }
function describeDlcReward(pack){
  const parts=[];
  if(pack.unlocks && pack.unlocks.length){ const names = STORY_MODES.filter(s=>pack.unlocks.includes(s.id)).map(s=>s.title); if(names.length) parts.push('Stories: '+names.join(', ')); }
  if(pack.modes && pack.modes.length){ const names = pack.modes.map(k=>GAME_MODES[k]?GAME_MODES[k].label:k); parts.push('Starting modes: '+names.join(', ')); }
  if(pack.cash){ parts.push(pack.cash>=1000?'£'+pack.cash.toLocaleString()+' club cash':'£'+pack.cash+' club cash'); }
  return parts.join(' · ');
}
function redeemCode(raw){
  const code = normalizeCode(raw);
  if(!code) return {ok:false, msg:'Enter a code first.'};
  const store = dlcLoad();
  if(store.redeemedCodes.indexOf(code)!==-1) return {ok:false, msg:'That code has already been redeemed on this device.'};
  const pack = dlcPackForCode(code);
  if(!pack) return {ok:false, msg:'Code not recognised. Check the spacing and capitals, then try again.'};
  store.redeemedCodes.push(code);
  if(pack.unlocks && pack.unlocks.length){
    if(store.dlc.indexOf(pack.id)===-1) store.dlc.push(pack.id);
  }
  if(pack.cash){
    if(state.game){ state.game.club.cash = (state.game.club.cash||0)+pack.cash; }
    else { store.giftCash = (store.giftCash||0)+pack.cash; }
  }
  dlcSave();
  return {ok:true, pack, msg:describeDlcReward(pack)};
}

  function ensureManagerState(){
    const g=state.game;
    if(!g.managerMode) g.managerMode={tactic:'balanced',morale:78,boardConfidence:72,objectives:[{name:'Finish above your current position',progress:42,target:100},{name:'Grow matchday income',progress:35,target:100},{name:'Develop one academy player',progress:15,target:100}]};
    if(!g.backroom) g.backroom={};
    if(!g.staffMarket) g.staffMarket=[];
    if(!g.managerMarket) g.managerMarket=generateManagerPool(g.club.reputation||20);
    if(!g.staffMarket.length) g.staffMarket=generateStaffMarket(g.club.reputation||20);
    STAFF_ROLES.forEach(r=>{
      if(g.backroom[r.id]===undefined) g.backroom[r.id]=null;
    });
  }
  function generateStaffMarket(rep){
    const first=['Alex','Jordan','Sam','Daniel','Chris','Jamie','Morgan','Taylor','Ryan','Dylan','Lewis','Owen','Callum','Harvey','Elliot','Noah'];
    const last=['Bennett','Clarke','Hayes','Morgan','Parker','Wilson','Foster','Mitchell','Turner','Brooks','Carter','Mason','Cooper','Hughes','Bishop','Reid'];
    const out=[];
    STAFF_ROLES.forEach((role,ri)=>{
      for(let i=0;i<3;i++){
        const rating=clamp(Math.round(45+Math.random()*38+rep*.10),40,94);
        const specialist=clamp(Math.round(rating+(Math.random()*12-6)),35,96);
        out.push({
          id:'staff-'+role.id+'-'+Date.now()+'-'+ri+'-'+i,
          role:role.id, name:first[Math.floor(Math.random()*first.length)]+' '+last[Math.floor(Math.random()*last.length)],
          rating,specialist,age:28+Math.floor(Math.random()*27),
          wage:Math.round(180+rating*14+Math.random()*350),
          fee:Math.round(800+rating*70+Math.random()*2200),
          years:1+Math.floor(Math.random()*4),
          style: role.id==='coach'?pick(['Technical','Development','Tactical']):role.name,
          trait:pick(['Elite Developer','Motivator','Data Driven','Club Builder','Negotiator','Calm Under Pressure'])
        });
      }
    });
    return out.sort((a,b)=>b.rating-a.rating);
  }
  function managerStyleName(id){return MANAGER_STYLES.find(x=>x.id===id)?.name||'Balanced';}
  function staffScore(){
    const g=state.game; ensureManagerState();
    const vals=STAFF_ROLES.map(r=>g.backroom[r.id]?.rating||0).filter(Boolean);
    return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):Math.round(g.club.staffQuality||25);
  }
  function backroomWages(){
    const g=state.game; ensureManagerState();
    return STAFF_ROLES.reduce((n,r)=>n+(g.backroom[r.id]?.wage||0),0)+(g.club.managerWage||0);
  }
  function staffImpact(){
    const g=state.game; ensureManagerState();
    let impact=0;
    STAFF_ROLES.forEach(r=>{if(g.backroom[r.id]) impact += (g.backroom[r.id].rating-50)*.10;});
    return Math.round(clamp(impact,-10,18));
  }
